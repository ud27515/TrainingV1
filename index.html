ary": "動詞のing形を名詞のように使うと「すること」を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-comparison", "subject": "英語", "sub": "文法", "name": "比較", "grade": 2, "prerequisites": ["en-be"], "lesson": "比較級は二つを比べ、最上級は範囲内で最も高い程度を表します。as...asは同程度。比較する範囲や対象を確かめます。", "summary": "比較級は二つを比べ、最上級は範囲内で最も高い程度を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-passive", "subject": "英語", "sub": "文法", "name": "受け身", "grade": 3, "prerequisites": ["en-past"], "lesson": "受け身はbe動詞＋過去分詞で「される」を表します。動作を受ける側が主語になります。", "summary": "受け身はbe動詞＋過去分詞で「される」を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-perfect", "subject": "英語", "sub": "文法", "name": "現在完了・完了進行形", "grade": 3, "prerequisites": ["en-past"], "lesson": "現在完了はhave/has＋過去分詞で、過去と現在のつながりを表します。継続・経験・完了を文脈で区別し、完了進行形はhave been＋ingです。", "summary": "現在完了はhave/has＋過去分詞で、過去と現在のつながりを表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-relative", "subject": "英語", "sub": "文法", "name": "分詞・関係代名詞", "grade": 3, "prerequisites": ["en-passive"], "lesson": "名詞を後ろから説明する表現があります。関係代名詞は先行詞と節を結び、分詞も動作や状態で名詞を修飾します。", "summary": "名詞を後ろから説明する表現があります。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-clause", "subject": "英語", "sub": "文法", "name": "接続詞・間接疑問・仮定法の基礎", "grade": 3, "prerequisites": ["en-future-modal"], "lesson": "接続詞は文の関係を表します。間接疑問では疑問詞の後が主語＋動詞の語順になります。仮定法では現実と異なる仮定を表す形を学びます。", "summary": "接続詞は文の関係を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-reading", "subject": "英語", "sub": "コミュニケーション", "name": "短文読解・必要な情報", "grade": 2, "prerequisites": ["en-past"], "lesson": "読解では、時・場所・人・目的を整理し、本文に書かれたことと推測を区別します。", "summary": "読解では、時・場所・人・目的を整理し、本文に書かれたことと推測を区別します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-dialogue", "subject": "英語", "sub": "コミュニケーション", "name": "会話・依頼・意見を伝える", "grade": 2, "prerequisites": ["english-question"], "lesson": "会話では相手の目的を捉え、返答の内容を合わせます。意見には理由を添え、分からないときは聞き返します。", "summary": "会話では相手の目的を捉え、返答の内容を合わせます。", "icon": "✧", "color": "#9db3ff"}, {"id": "ma-signed", "subject": "数学", "sub": "代数", "name": "正負の数", "grade": 1, "prerequisites": [], "lesson": "負の数を引くことは、その反対の数を足すことです。乗除は符号と絶対値を分けて考え、計算の順序を守ります。", "summary": "負の数を引くことは、その反対の数を足すことです。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-expression", "subject": "数学", "sub": "代数", "name": "文字式・式の値", "grade": 1, "prerequisites": ["ma-signed"], "lesson": "文字式では掛け算の記号を省き、数を前に書きます。同類項は係数をまとめ、代入するときは負の数を括弧に入れます。", "summary": "文字式では掛け算の記号を省き、数を前に書きます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-ratio", "subject": "数学", "sub": "代数", "name": "割合・比と方程式の利用", "grade": 1, "prerequisites": ["math-equation"], "lesson": "割合を小数や分数に直し、何を基準にしているかを確認します。比では対応する量の関係を保ちます。", "summary": "割合を小数や分数に直し、何を基準にしているかを確認します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-proportion", "subject": "数学", "sub": "代数", "name": "比例・反比例", "grade": 1, "prerequisites": ["ma-expression"], "lesson": "比例はy=ax、反比例はy=a/xで表します。比例ではy/x、反比例ではxyが一定です。", "summary": "比例はy=ax、反比例はy=a/xで表します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-simultaneous", "subject": "数学", "sub": "代数", "name": "連立方程式", "grade": 2, "prerequisites": ["math-equation"], "lesson": "二つの式を同時に満たす組を求めます。加減法や代入法で文字を一つ消し、解を両方の式に戻して確かめます。", "summary": "二つの式を同時に満たす組を求めます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-linear", "subject": "数学", "sub": "代数", "name": "一次関数", "grade": 2, "prerequisites": ["ma-proportion"], "lesson": "一次関数y=ax+bでaは変化の割合、bはy切片です。表やグラフの二点から増加量の比を求めます。", "summary": "一次関数y=ax+bでaは変化の割合、bはy切片です。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-expand", "subject": "数学", "sub": "代数", "name": "展開・因数分解", "grade": 3, "prerequisites": ["ma-expression"], "lesson": "展開は積を和へ、因数分解は和を積へ直します。共通因数や乗法公式を使い、逆に展開して確かめます。", "summary": "展開は積を和へ、因数分解は和を積へ直します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-root", "subject": "数学", "sub": "代数", "name": "平方根", "grade": 3, "prerequisites": ["ma-signed"], "lesson": "平方根は二乗するとその数になる数。√aは非負の平方根を表します。根号の中の平方因数を外に出して整理します。", "summary": "平方根は二乗するとその数になる数。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-quadratic-eq", "subject": "数学", "sub": "代数", "name": "二次方程式", "grade": 3, "prerequisites": ["ma-expand", "ma-root"], "lesson": "二次方程式は因数分解、平方根、解の公式などで解きます。積が0なら少なくとも一方が0です。解を落とさないようにします。", "summary": "二次方程式は因数分解、平方根、解の公式などで解きます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-quadratic-fn", "subject": "数学", "sub": "代数", "name": "関数y=ax²", "grade": 3, "prerequisites": ["ma-linear", "ma-root"], "lesson": "y=ax²ではxが2倍になるとyは4倍になります。グラフはy軸に対称で、変化の割合は区間によって変わります。", "summary": "y=ax²ではxが2倍になるとyは4倍になります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-data", "subject": "数学", "sub": "代数", "name": "データの整理・代表値", "grade": 1, "prerequisites": [], "lesson": "平均値・中央値・最頻値は異なる特徴を表します。極端な値の影響やデータの並びを確認し、目的に合う代表値を選びます。", "summary": "平均値・中央値・最頻値は異なる特徴を表します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-probability", "subject": "数学", "sub": "代数", "name": "確率", "grade": 2, "prerequisites": ["ma-ratio"], "lesson": "同様に確からしい場合の数を数え、求める場合の数を全体で割ります。順序を区別するか、取り出した物を戻すかを確かめます。", "summary": "同様に確からしい場合の数を数え、求める場合の数を全体で割ります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-sampling", "subject": "数学", "sub": "代数", "name": "四分位範囲・標本調査", "grade": 3, "prerequisites": ["ma-data"], "lesson": "箱ひげ図では中央値と四分位数などを読みます。標本調査は母集団から偏りなく選んだ一部を使って全体を推測します。", "summary": "箱ひげ図では中央値と四分位数などを読みます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-plane", "subject": "数学", "sub": "幾何", "name": "平面図形・作図・移動", "grade": 1, "prerequisites": [], "lesson": "平行移動・回転移動・対称移動は図形の形と大きさを保ちます。垂直二等分線上の点は線分の両端から等距離です。", "summary": "平行移動・回転移動・対称移動は図形の形と大きさを保ちます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-solid", "subject": "数学", "sub": "幾何", "name": "空間図形・表面積・体積", "grade": 1, "prerequisites": ["ge-plane"], "lesson": "柱体の体積は底面積×高さ、錐体はその1/3。表面積は各面の面積の合計です。高さは底面への垂直距離です。", "summary": "柱体の体積は底面積×高さ、錐体はその1/3。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-angle", "subject": "数学", "sub": "幾何", "name": "平行線と多角形の角", "grade": 2, "prerequisites": ["ge-plane"], "lesson": "平行線では同位角と錯角が等しくなります。三角形の内角の和は180°、n角形は(n−2)×180°です。", "summary": "平行線では同位角と錯角が等しくなります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-congruence", "subject": "数学", "sub": "幾何", "name": "合同と証明", "grade": 2, "prerequisites": ["ge-angle"], "lesson": "合同の証明では、対応する頂点をそろえ、条件がどの合同条件を満たすかを示します。図の見た目だけを根拠にしません。", "summary": "合同の証明では、対応する頂点をそろえ、条件がどの合同条件を満たすかを示します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-quadrilateral", "subject": "数学", "sub": "幾何", "name": "三角形・四角形の性質", "grade": 2, "prerequisites": ["ge-congruence"], "lesson": "二等辺三角形の底角は等しく、平行四辺形の対辺・対角は等しいなどの性質があります。性質と成立条件を区別します。", "summary": "二等辺三角形の底角は等しく、平行四辺形の対辺・対角は等しいなどの性質があります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-similarity", "subject": "数学", "sub": "幾何", "name": "相似・面積比・体積比", "grade": 3, "prerequisites": ["ge-congruence"], "lesson": "相似では対応する辺の比が等しく、対応する角が等しくなります。相似比a:bなら面積比a²:b²、体積比a³:b³です。", "summary": "相似では対応する辺の比が等しく、対応する角が等しくなります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-circle", "subject": "数学", "sub": "幾何", "name": "円周角・接線", "grade": 3, "prerequisites": ["ge-angle"], "lesson": "同じ弧に対する円周角は等しく、中心角の半分です。直径に対する円周角は90°。接線と接点への半径は垂直です。", "summary": "同じ弧に対する円周角は等しく、中心角の半分です。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-pythagoras", "subject": "数学", "sub": "幾何", "name": "三平方の定理", "grade": 3, "prerequisites": ["ma-root", "ge-similarity"], "lesson": "直角三角形では斜辺の二乗が他の二辺の二乗の和になります。直角の位置と斜辺を先に確認します。", "summary": "直角三角形では斜辺の二乗が他の二辺の二乗の和になります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "sc-light", "subject": "理科", "sub": "物理・化学", "name": "光の反射・屈折・凸レンズ", "grade": 1, "prerequisites": [], "lesson": "光は境界で反射・屈折します。角度は面に立てた垂線から測ります。凸レンズでは物体と焦点の位置関係で像の性質が変わります。", "summary": "光は境界で反射・屈折します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-force", "subject": "理科", "sub": "物理・化学", "name": "力・圧力・浮力", "grade": 1, "prerequisites": [], "lesson": "力は大きさ・向き・作用点を持ちます。同じ物体に働く2力のつり合いは同一直線上・逆向き・同じ大きさ。圧力は面積あたりの力です。", "summary": "力は大きさ・向き・作用点を持ちます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-electric", "subject": "理科", "sub": "物理・化学", "name": "電流・電圧・抵抗", "grade": 2, "prerequisites": ["ma-proportion"], "lesson": "電流は電荷の流れ。オームの法則V=RIを使い、直列では電流、並列では各枝の電圧が等しいことを利用します。", "summary": "電流は電荷の流れ。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-magnet", "subject": "理科", "sub": "物理・化学", "name": "電力・磁界・電磁誘導", "grade": 2, "prerequisites": ["sc-electric"], "lesson": "電力は電圧×電流、電力量は電力×時間です。電流は磁界を作り、コイルを貫く磁界の変化は誘導電流を生みます。", "summary": "電力は電圧×電流、電力量は電力×時間です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-motion", "subject": "理科", "sub": "物理・化学", "name": "運動・仕事・エネルギー", "grade": 3, "prerequisites": ["sc-force"], "lesson": "運動は位置の時間変化で調べます。力が働く向きに動いた距離との積が仕事。摩擦などがなければ力学的エネルギーが保存されます。", "summary": "運動は位置の時間変化で調べます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-substance", "subject": "理科", "sub": "物理・化学", "name": "物質・密度・気体", "grade": 1, "prerequisites": [], "lesson": "密度は質量÷体積です。気体の集め方は水への溶けやすさと空気に対する密度で選びます。", "summary": "密度は質量÷体積です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-solution", "subject": "理科", "sub": "物理・化学", "name": "水溶液・溶解度・状態変化", "grade": 1, "prerequisites": ["sc-substance"], "lesson": "溶解度は一定量の溶媒に溶ける溶質の限度です。状態変化では物質そのものの種類は変わらず、質量は保存されます。", "summary": "溶解度は一定量の溶媒に溶ける溶質の限度です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-reaction", "subject": "理科", "sub": "物理・化学", "name": "原子・分子・化学変化", "grade": 2, "prerequisites": ["sc-substance"], "lesson": "化学変化では原子の組み合わせが変わります。原子の種類と数が保存されるように化学反応式の係数をそろえます。", "summary": "化学変化では原子の組み合わせが変わります。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-oxidation", "subject": "理科", "sub": "物理・化学", "name": "酸化・還元と熱", "grade": 2, "prerequisites": ["sc-reaction"], "lesson": "酸素と結びつく変化を酸化、酸化物から酸素を取り除く変化を還元と捉えます。反応では熱の出入りも起きます。", "summary": "酸素と結びつく変化を酸化、酸化物から酸素を取り除く変化を還元と捉えます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-ion", "subject": "理科", "sub": "物理・化学", "name": "イオン・酸とアルカリ・電池", "grade": 3, "prerequisites": ["sc-reaction", "sc-electric"], "lesson": "イオンは電子を失ったり受け取ったりして電気を帯びた粒子です。酸とアルカリの中和では水などが生じ、電池は化学エネルギーを電気に変えます。", "summary": "イオンは電子を失ったり受け取ったりして電気を帯びた粒子です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-life", "subject": "理科", "sub": "生物・地学", "name": "生物の観察・分類", "grade": 1, "prerequisites": [], "lesson": "生物を特徴で比べ、共通点と相違点から分類します。顕微鏡は低倍率から観察し、対象を見失わないようにします。", "summary": "生物を特徴で比べ、共通点と相違点から分類します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-plant", "subject": "理科", "sub": "生物・地学", "name": "植物のつくり・光合成", "grade": 1, "prerequisites": ["sc-life"], "lesson": "植物は光合成で二酸化炭素と水から有機物を作り、酸素を出します。呼吸は昼夜とも行い、蒸散は水の移動に関係します。", "summary": "植物は光合成で二酸化炭素と水から有機物を作り、酸素を出します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-cell", "subject": "理科", "sub": "生物・地学", "name": "細胞と体のつくり", "grade": 2, "prerequisites": ["sc-life"], "lesson": "生物の体は細胞からできています。細胞が集まって組織、組織が集まって器官を作ります。植物と動物には共通点と相違点があります。", "summary": "生物の体は細胞からできています。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-human", "subject": "理科", "sub": "生物・地学", "name": "消化・呼吸・循環・神経", "grade": 2, "prerequisites": ["sc-cell"], "lesson": "消化で栄養分を吸収しやすい形にし、血液が運びます。肺で気体交換を行い、神経系が刺激と反応をつなぎます。", "summary": "消化で栄養分を吸収しやすい形にし、血液が運びます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-genetics", "subject": "理科", "sub": "生物・地学", "name": "生殖・遺伝・進化", "grade": 3, "prerequisites": ["sc-cell"], "lesson": "有性生殖は生殖細胞が合体し、無性生殖は合体を伴いません。遺伝情報は親から子へ伝わり、形質の現れ方を考えます。", "summary": "有性生殖は生殖細胞が合体し、無性生殖は合体を伴いません。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-ecology", "subject": "理科", "sub": "生物・地学", "name": "生態系と環境", "grade": 3, "prerequisites": ["sc-plant", "sc-human"], "lesson": "食物連鎖は生物間の食べる・食べられる関係です。物質は循環し、エネルギーは流れます。分解者は有機物を無機物へ分解します。", "summary": "食物連鎖は生物間の食べる・食べられる関係です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-earth", "subject": "理科", "sub": "生物・地学", "name": "地震・火山・岩石・地層", "grade": 1, "prerequisites": [], "lesson": "地震のP波はS波より速く到達します。火成岩は冷え方で組織が変わり、地層や化石は過去の環境を知る手掛かりになります。", "summary": "地震のP波はS波より速く到達します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-weather", "subject": "理科", "sub": "生物・地学", "name": "気象・湿度・前線", "grade": 2, "prerequisites": [], "lesson": "気象は気温・湿度・気圧などを観測します。空気が冷えて飽和すると凝結が起こり、前線付近では空気が上昇して雲ができます。", "summary": "気象は気温・湿度・気圧などを観測します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-space", "subject": "理科", "sub": "生物・地学", "name": "天体・季節・月と惑星", "grade": 3, "prerequisites": [], "lesson": "地球の自転で日周運動、公転と地軸の傾きで季節変化が起こります。月は太陽光を反射し、位置関係で満ち欠けします。", "summary": "地球の自転で日周運動、公転と地軸の傾きで季節変化が起こります。", "icon": "◈", "color": "#85c7b3"}, {"id": "ja-word", "subject": "国語", "sub": "国語2・文法・古典", "name": "文節・単語・品詞", "grade": 1, "prerequisites": [], "lesson": "文節は文を意味が通じるように短く区切ったまとまり。自立語は単独で文節を作れ、付属語は自立語に付いて働きます。", "summary": "文節は文を意味が通じるように短く区切ったまとまり。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-inflection", "subject": "国語", "sub": "国語2・文法・古典", "name": "用言・活用・助動詞", "grade": 2, "prerequisites": ["ja-word"], "lesson": "動詞・形容詞・形容動詞は用言です。続く語に応じて形が変わることを活用といい、助動詞も活用します。", "summary": "動詞・形容詞・形容動詞は用言です。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-sentence", "subject": "国語", "sub": "国語2・文法・古典", "name": "文の成分・敬語", "grade": 2, "prerequisites": ["ja-word"], "lesson": "主語・述語・修飾語などの関係を捉えます。尊敬語は相手側の動作を高め、謙譲語は自分側の動作を低めて相手を立てます。", "summary": "主語・述語・修飾語などの関係を捉えます。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-classic", "subject": "国語", "sub": "国語2・文法・古典", "name": "古文の言葉・歴史的仮名遣い", "grade": 1, "prerequisites": [], "lesson": "古文は現在と意味が異なる語にも注意します。歴史的仮名遣いは、語中・語尾の「は・ひ・ふ・へ・ほ」などが現代と異なります。", "summary": "古文は現在と意味が異なる語にも注意します。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-kanbun", "subject": "国語", "sub": "国語2・文法・古典", "name": "漢文の訓読・返り点", "grade": 2, "prerequisites": [], "lesson": "漢文は返り点や送り仮名を手がかりに日本語の語順で読みます。レ点はすぐ下の字を先に読み、そのあと上の字に返る印です。", "summary": "漢文は返り点や送り仮名を手がかりに日本語の語順で読みます。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-logic", "subject": "国語", "sub": "国語3・現代文・語句", "name": "説明文・論説文の構造", "grade": 1, "prerequisites": [], "lesson": "主張と根拠、具体例を区別します。接続語は文どうしの関係を示しますが、内容との対応も確かめましょう。", "summary": "主張と根拠、具体例を区別します。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-fiction", "subject": "国語", "sub": "国語3・現代文・語句", "name": "物語・心情と描写", "grade": 1, "prerequisites": [], "lesson": "人物の心情は行動、会話、情景と前後の変化から読み取ります。本文にない事情を勝手に付け足さないことが大切です。", "summary": "人物の心情は行動、会話、情景と前後の変化から読み取ります。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-poetry", "subject": "国語", "sub": "国語3・現代文・語句", "name": "詩・短歌・俳句と表現技法", "grade": 2, "prerequisites": [], "lesson": "短歌は五・七・五・七・七、俳句は五・七・五を基本とします。比喩や反復などの表現が与える印象を考えます。", "summary": "短歌は五・七・五・七・七、俳句は五・七・五を基本とします。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-vocabulary", "subject": "国語", "sub": "国語3・現代文・語句", "name": "漢字・語句・慣用句", "grade": 1, "prerequisites": [], "lesson": "漢字は同音でも意味で使い分けます。慣用句は語全体が作る意味を捉え、文脈に合うか確かめます。", "summary": "漢字は同音でも意味で使い分けます。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-expression", "subject": "国語", "sub": "国語3・現代文・語句", "name": "要約・意見文・情報の吟味", "grade": 3, "prerequisites": ["ja-logic"], "lesson": "要約では中心となる内容を残します。意見文は主張と根拠を結び、情報は出典や調査方法、事実と意見の区別を確かめます。", "summary": "要約では中心となる内容を残します。", "icon": "❧", "color": "#c6a0df"}, {"id": "so-map", "subject": "社会", "sub": "地理", "name": "地図・緯度経度・時差", "grade": 1, "prerequisites": [], "lesson": "緯度は赤道を0度、経度は本初子午線を0度とします。地球は24時間で360度自転するので、経度15度につき時差1時間が目安です。", "summary": "緯度は赤道を0度、経度は本初子午線を0度とします。", "icon": "◎", "color": "#d8b678"}, {"id": "so-world", "subject": "社会", "sub": "地理", "name": "世界の州・地形・生活", "grade": 1, "prerequisites": ["so-map"], "lesson": "地域の生活は自然環境だけでなく、歴史・文化・産業とも関係します。同じ州の中にも多様な地域があります。", "summary": "地域の生活は自然環境だけでなく、歴史・文化・産業とも関係します。", "icon": "◎", "color": "#d8b678"}, {"id": "so-asia", "subject": "社会", "sub": "地理", "name": "アジアの産業と人口", "grade": 1, "prerequisites": ["so-world"], "lesson": "アジアには多様な気候や文化があります。モンスーンの影響を受ける地域の農業、工業化と都市化などを関連付けます。", "summary": "アジアには多様な気候や文化があります。", "icon": "◎", "color": "#d8b678"}, {"id": "so-europe", "subject": "社会", "sub": "地理", "name": "ヨーロッパ・アフリカ", "grade": 1, "prerequisites": ["so-world"], "lesson": "ヨーロッパでは地域統合、アフリカでは多様な自然と歴史、資源や特定産品に依存する経済などを学びます。", "summary": "ヨーロッパでは地域統合、アフリカでは多様な自然と歴史、資源や特定産品に依存する経済などを学びます。", "icon": "◎", "color": "#d8b678"}, {"id": "so-america", "subject": "社会", "sub": "地理", "name": "南北アメリカ・オセアニア", "grade": 1, "prerequisites": ["so-world"], "lesson": "大規模農業や資源、移民の歴史、森林と開発などを関連付けて学びます。環境と経済の両面を捉えましょう。", "summary": "大規模農業や資源、移民の歴史、森林と開発などを関連付けて学びます。", "icon": "◎", "color": "#d8b678"}, {"id": "so-japan", "subject": "社会", "sub": "地理", "name": "日本の地形・気候・災害", "grade": 2, "prerequisites": ["so-map"], "lesson": "日本は山地が多く、地域や季節で気候が異なります。自然の恵みと災害の双方を、地図や資料から考えます。", "summary": "日本は山地が多く、地域や季節で気候が異なります。", "icon": "◎", "color": "#d8b678"}, {"id": "so-industry", "subject": "社会", "sub": "地理", "name": "日本の人口・産業・交通", "grade": 2, "prerequisites": ["so-japan"], "lesson": "人口分布、産業立地、交通網を関連付けます。割合と人数、総量と一人当たりの値は区別して読みます。", "summary": "人口分布、産業立地、交通網を関連付けます。", "icon": "◎", "color": "#d8b678"}, {"id": "so-region", "subject": "社会", "sub": "地理", "name": "日本の諸地域・地域調査", "grade": 2, "prerequisites": ["so-industry"], "lesson": "地域調査は問いを立て、資料や現地観察で確かめます。地域の特徴は自然と産業、人々の暮らしのつながりから説明します。", "summary": "地域調査は問いを立て、資料や現地観察で確かめます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-ancient", "subject": "社会", "sub": "歴史", "name": "文明の成立・古代国家", "grade": 1, "prerequisites": [], "lesson": "農耕と定住、都市と国家、文字の成立を関連付けます。日本では縄文・弥生・古墳時代の社会の変化を捉えます。", "summary": "農耕と定住、都市と国家、文字の成立を関連付けます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-rules", "subject": "社会", "sub": "歴史", "name": "律令国家・奈良・平安", "grade": 1, "prerequisites": ["hi-ancient"], "lesson": "律令による国家の仕組み、都、仏教、貴族政治と文化を関連付けます。時代に伴う土地制度や政治の変化も重要です。", "summary": "律令による国家の仕組み、都、仏教、貴族政治と文化を関連付けます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-medieval", "subject": "社会", "sub": "歴史", "name": "鎌倉・室町と武士の政治", "grade": 1, "prerequisites": ["hi-rules"], "lesson": "鎌倉幕府では御恩と奉公が将軍と御家人を結びました。室町時代には守護大名の成長や商業・自治の発達が見られます。", "summary": "鎌倉幕府では御恩と奉公が将軍と御家人を結びました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-edo", "subject": "社会", "sub": "歴史", "name": "天下統一・江戸幕府と社会", "grade": 2, "prerequisites": ["hi-medieval"], "lesson": "天下統一を経て江戸幕府が成立しました。幕府と藩の支配、身分、対外関係、都市と文化の発達を学びます。", "summary": "天下統一を経て江戸幕府が成立しました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-modern", "subject": "社会", "sub": "歴史", "name": "近代革命・産業革命", "grade": 2, "prerequisites": [], "lesson": "欧米の市民革命は政治の権利や制度を変え、産業革命は生産や社会を変えました。発展とともに労働問題なども生まれました。", "summary": "欧米の市民革命は政治の権利や制度を変え、産業革命は生産や社会を変えました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-meiji", "subject": "社会", "sub": "歴史", "name": "開国・明治維新・近代国家", "grade": 2, "prerequisites": ["hi-edo", "hi-modern"], "lesson": "開国と幕府の崩壊を経て、明治政府は中央集権化と近代化を進めました。自由民権運動や憲法制定も関連付けます。", "summary": "開国と幕府の崩壊を経て、明治政府は中央集権化と近代化を進めました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-war", "subject": "社会", "sub": "歴史", "name": "世界大戦・恐慌と日本", "grade": 3, "prerequisites": ["hi-meiji"], "lesson": "二つの世界大戦の背景、世界恐慌、政治と社会の変化を因果関係で捉えます。出来事の順序と同時代の世界にも注目します。", "summary": "二つの世界大戦の背景、世界恐慌、政治と社会の変化を因果関係で捉えます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-postwar", "subject": "社会", "sub": "歴史", "name": "戦後改革・冷戦・現代への歩み", "grade": 3, "prerequisites": ["hi-war"], "lesson": "戦後日本の民主化と経済成長、冷戦、国際社会の変化を捉えます。経済成長による生活の変化と課題も学びます。", "summary": "戦後日本の民主化と経済成長、冷戦、国際社会の変化を捉えます。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-rights", "subject": "社会", "sub": "公民", "name": "日本国憲法・人権", "grade": 3, "prerequisites": [], "lesson": "日本国憲法の基本原理は国民主権・基本的人権の尊重・平和主義です。権利は互いに関わり、他者の権利への配慮も必要です。", "summary": "日本国憲法の基本原理は国民主権・基本的人権の尊重・平和主義です。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-politics", "subject": "社会", "sub": "公民", "name": "国会・内閣・裁判所", "grade": 3, "prerequisites": ["ci-rights"], "lesson": "国会は立法、内閣は行政、裁判所は司法を担います。権力を分け、互いに抑制することで集中を防ぎます。", "summary": "国会は立法、内閣は行政、裁判所は司法を担います。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-local", "subject": "社会", "sub": "公民", "name": "選挙・地方自治・合意形成", "grade": 3, "prerequisites": ["ci-politics"], "lesson": "地方自治は身近な地域の課題を住民が考える仕組みです。意思決定では効率と公正、少数意見への配慮を考えます。", "summary": "地方自治は身近な地域の課題を住民が考える仕組みです。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-market", "subject": "社会", "sub": "公民", "name": "市場・企業・消費者", "grade": 3, "prerequisites": [], "lesson": "市場では需要と供給が価格に関係します。企業・家計・政府の関わりを捉え、契約や情報の扱いも学びます。", "summary": "市場では需要と供給が価格に関係します。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-public", "subject": "社会", "sub": "公民", "name": "財政・社会保障・国際社会", "grade": 3, "prerequisites": ["ci-market", "ci-rights"], "lesson": "政府は税などを財源に公共サービスや社会保障を担います。国際社会の課題は国境を越えた協力や持続可能性の観点から考えます。", "summary": "政府は税などを財源に公共サービスや社会保障を担います。", "icon": "◎", "color": "#d8b678"}]);

yは0から1へ増える", "負のxが0に近づく区間では、xは増えても二乗の値は小さくなります。区間を確認します。"], ["ma-quadratic-fn", "connect", "y＝ax²のグラフが点(−2,12)を通る。aは？", "3", "−6", "6", "x＝−2、y＝12を代入すると12＝4aなのでa＝3です。負の数を二乗した符号に注意します。"], ["ma-quadratic-fn", "create", "y＝x²で−2≦x≦3のとき、yの範囲は？", "0≦y≦9", "4≦y≦9", "−4≦y≦9", "区間にx＝0を含むので最小値は0。端点の二乗を比較すると最大値は3²＝9です。端点だけで最小値を決めません。"], ["ma-data", "solve", "データ2、3、3、4、18の中央値は？", "3", "6", "18", "小さい順に並べた5個の中央、3番目は3です。6は平均値、18は最大値です。"], ["ma-data", "detect", "データ4、5、5、6、10の最後の10だけを50に変更した。変わらないものは？", "中央値", "平均値", "範囲", "変更前後とも中央は5。平均値は大きくなり、最大値−最小値である範囲も大きくなります。"], ["ma-data", "connect", "A組は20人で平均点60点、B組は30人で平均点70点。全体の平均は？", "66点", "65点", "68点", "総得点は20×60＋30×70＝3300点。50人で割って66点です。人数が異なるので平均値同士を単純平均しません。"], ["ma-data", "create", "『ふだん何分待つか』を、1回だけ長時間待った影響を小さくして示したい。選ぶ代表値は？", "中央値", "平均値", "最大値", "中央値は中央の位置の値なので、極端に大きい値の影響を受けにくくなります。目的に合った代表値を選びます。", "待ち時間の記録：3分、4分、4分、5分、44分。"], ["ma-probability", "solve", "区別できる大小2個の公平なさいころを投げる。出た目の和が5となる確率は？", "1/9", "1/6", "1/12", "(1,4)、(2,3)、(3,2)、(4,1)の4通り。全36通りは同様に確からしいので4/36＝1/9です。"], ["ma-probability", "detect", "『赤球が1個、白球が3個ある。色は2種類だから赤が出る確率は1/2』の問題点は？", "二つの色が同様に確からしいとは限らない", "球は4個なので白が出る確率も1/4である", "取り出す球が1個なので赤が出る確率は1である", "各球が等しい確率で選ばれるなら赤は4個中1個なので1/4。色の種類数だけでは確率を求められません。"], ["ma-probability", "connect", "赤2個・青1個の球をよく混ぜて1個ずつ2回取り出す。最初の球を戻さないとき、両方赤になる確率は？", "1/3", "4/9", "2/3", "1回目の赤は2/3。そのあと残る2個中赤は1個なので、2/3×1/2＝1/3。戻す場合とは異なります。"], ["ma-probability", "create", "公平なコインを3回投げる。少なくとも1回表が出る確率を、余事象で求める式は？", "1−(1/2)³", "(1/2)³", "3×(1/2)", "『少なくとも1回表』の反対は『3回とも裏』です。その確率1/8を全体の1から引きます。"], ["ma-sampling", "solve", "小さい順に並べた2、4、6、8、10、12、14、16の四分位範囲は？", "8", "14", "9", "下半分の中央値Q1は(4＋6)/2＝5、上半分の中央値Q3は(12＋14)/2＝13。四分位範囲は13−5＝8です。"], ["ma-sampling", "detect", "全校生徒の読書時間を推定するため、図書委員だけに聞いた。問題点は？", "標本に読書への関心の高い人が偏る可能性がある", "標本調査は全数調査より必ず正確になる", "人数を数えれば選び方による偏りはなくなる", "全校の特徴を推定するには、調査する人の選び方が重要です。人数だけでなく、偏りを抑える方法を考えます。"], ["ma-sampling", "connect", "池の魚100匹に印を付けて戻した。十分混ざった後、50匹を捕まえると印付きが10匹。条件が保たれたとして総数の推定は？", "500匹", "200匹", "1000匹", "標本で印付きの割 nect", "最後の『隣の席を少し空けた』という行動から最も読み取れることは？", "相手と一緒に過ごすきっかけを作ろうとしている", "相手にもう近づかないでほしいと思っている", "自分が教室から出る準備をしている", "声をかけられなかったユウが、席を空けて本を差し出す行動へ変わっています。相手を受け入れようとする姿が読み取れます。", "転校してきた生徒に、ユウは声をかけようとして何度も言葉をのみこんだ。休み時間も、その生徒は一人で本を読んでいた。\n\n翌日、ユウは同じ作者の本を机に置いた。相手が表紙を見たとき、隣の席を少し空け、本をそっと差し出した。"], ["ja-fiction", "detect", "『ミナは結果を気にしていなかった』という読みを見直す根拠は？", "封筒の角を何度もなぞってから開けた描写", "窓の外に雲が見えた描写", "机の上に辞書があった描写", "開けるまで繰り返し封筒に触れる行動は、結果を気にしている様子の手掛かりです。ただし具体的な結果はまだ示されていません。", "机の上の辞書の横に、結果の入った封筒が置かれていた。窓の外には薄い雲が流れていた。\n\nミナは封筒の角を何度もなぞった。しばらくして息を吐き、ようやく封を切った。"], ["ja-fiction", "solve", "アキが傘を持って戻った直接のきっかけは？", "弟が玄関で雨を見ている姿に気づいたこと", "雨がやんだと分かったこと", "弟から電話で頼まれたこと", "雨を見ている弟の姿を見たあと、アキは立ち止まり引き返しています。電話や雨がやんだという情報はありません。", "アキは急いで家を出た。角を曲がる前に振り返ると、弟が傘を持たず、玄関から雨を見ていた。\n\nアキは足を止めた。一度見た腕時計をかばんにしまい、予備の傘を取りに家へ戻った。"], ["ja-fiction", "connect", "『もう一度、やってみる』という言葉に表れた変化は？", "失敗を避けたい気持ちから、再挑戦する気持ちへの変化", "相手に任せたい気持ちから、練習をやめたい気持ちへの変化", "成功を喜ぶ気持ちから、相手を責める気持ちへの変化", "最初は順番を譲ろうとしましたが、失敗後には自分からもう一度挑戦すると言っています。成功したとは書かれていません。", "順番が近づくと、レンは『先にやっていいよ』と友達に言った。やがて自分の番になり、跳び箱の前で止まってしまった。\n\n友達は『助走はよかった』と言った。レンは少し離れた場所に立ち、『もう一度、やってみる』と自分から列に戻った。"], ["ja-fiction", "detect", "語り手が直接見聞きした事実と区別すべきものは？", "父はきっと残念だったのだろう、という推測", "父が皿を二枚並べたこと", "父が『また今度にしよう』と言ったこと", "『きっと』『だろう』は語り手の推測を示します。父の内心そのものを直接確かめた記述ではありません。", "父は皿を二枚並べ、時計を見た。私が友達との約束を思い出して告げると、『また今度にしよう』と言った。\n\n玄関で靴を履きながら、私は父の小さな声を思い返した。父はきっと残念だったのだろう。明日は先に予定を伝えようと思った。"], ["ja-fiction", "create", "本文に合う見出しは？", "受け取った親切を、次の人へ", "なくした手袋を、最後まで探して", "待ち合わせに、間に合うために", "以前助けてもらった経験が、今度は別の人を助ける行動につながっています。手袋の紛失や待ち合わせが中心ではありません。", "去年の冬、ハルが手を冷やしていたとき、上級生が予備の手袋を貸してくれた。名前を聞く前に、その人は校門の向こうへ走っていった。\n\n今年、下級生が両手に息を吹きかけていた。ハルはかばんから予備の手袋を出し、『返すのはいつでもいいよ』と渡した。"], ["ja-expression", "create", "本文の要約として適切なのは？", "利用時間を延ばしたが、負担も増えたため運営方法を見直すことにした", "利用時間を短くした結果、担当者の負担が減った", "担当者の負担をなくすため、施設を閉鎖することにした", "取り組み、利点、課題、次の方針を残した要約です。閉鎖や利用時間短縮は本文にありません。", "自習室を夕方まで開けると、放課後に利用する人が増えた。家では集中しにくいという生徒からも好評だった。\n\n一方、見守る担当者の負担が増えた。そこで、利用を続けながら担当を交代できる仕組みを検討することにした。"], ["ja-expression", "det (function(C){const revisions=[{"id": "so-map-solve", "options": ["0度", "北緯30度", "南緯30度"], "explanation": "赤道の緯度は0度。北緯・南緯は赤道からの角度なので、北緯30度や南緯30度は赤道上ではありません。"}, {"id": "so-map-create", "options": ["2時間", "1時間", "3時間"], "explanation": "地球は24時間で360度回転するので、1時間あたり15度。経度差30度なら30÷15＝2時間です。実際の標準時には国の制度も関わります。"}, {"id": "so-world-connect", "options": ["断熱性を高める", "通気性を高めて外気を通す", "日射を遮る面積を増やす"], "explanation": "寒さに備えるには室内の熱が外へ逃げにくい断熱が役立ちます。通風や日射を遮る工夫は暑さへの対策とは関係しますが、この問いの寒さへの対策とは区別します。"}, {"id": "so-asia-solve", "options": ["稲作", "小麦栽培", "オリーブ栽培"], "explanation": "温暖で水を得やすい条件は水田での稲作に適しています。小麦やオリーブも栽培されますが、この問いでは水を豊富に使う代表的な稲作を選びます。"}, {"id": "so-asia-connect", "options": ["交通混雑や住宅不足", "住宅需要の減少による空室の増加", "通勤者数の減少による交通量の低下"], "explanation": "都市への人口集中で住宅や交通の需要が増え、整備が追い付かなければ混雑や住宅不足が起こりえます。空室増加や交通量低下は、ここで示された人口集中とは逆向きの変化です。"}, {"id": "so-asia-create", "options": ["産業別の就業者割合の推移", "総人口の年ごとの推移", "地域別の人口密度の分布"], "explanation": "産業構成は、どの産業がどれくらいの割合を占めるかという内訳です。総人口だけでは産業別の内訳が分からず、一時点の人口密度だけでは変化を追えません。"}, {"id": "so-europe-solve", "options": ["乾燥しやすい", "冬より降水量が多くなりやすい", "冬とほぼ同じ量の雨が降り続ける"], "explanation": "地中海性気候は夏の乾燥と冬の降水が特徴です。夏と冬の降水の違いに注目し、年間を通して一様に雨が降る気候と区別します。"}, {"id": "so-america-solve", "options": ["熱帯雨林", "温帯の落葉広葉樹林", "亜寒帯の針葉樹林"], "explanation": "アマゾン川流域には高温多雨の環境に対応した熱帯雨林が広がります。寒暖の季節変化がある温帯や、寒さの厳しい亜寒帯の森林とは区別します。"}, {"id": "so-america-connect", "options": ["乾燥して水が得にくい", "標高の高い山脈が内陸全体を占める", "多雨で湿地が内陸全体に広がる"], "explanation": "オーストラリア内陸部には乾燥地域が広く、水の確保が生活や産業の制約になります。内陸全体が高山や多雨の湿地だと捉えるのは適切ではありません。"}, {"id": "so-industry-solve", "options": ["輸送の便がよい", "輸入原料の産地に隣接できる", "港に近いほど原料の使用量が減る"], "explanation": "港からの陸上輸送や積み替えの負担を小さくしやすい点が利点です。輸入元の産地が近くなるわけではなく、立地だけで製品に必要な原料量も減りません。"}, {"id": "so-industry-create", "options": ["分類や集計年などの条件", "グラフの縦軸の単位だけ", "資料に載っている地域数だけ"], "explanation": "同じ対象を比べられるよう、産業分類や比較する年などを確認します。単位や地域数が同じでも、分類や対象期間が違えばそのまま比較できません。"}, {"id": "so-region-solve", "options": ["広い耕地を確保しやすい地域がある", "一年を通して高温で稲を何度も収穫できる", "傾斜の急な狭い農地が一様に広がる"], "explanation": "北海道には広い耕地を生かし、機械を用いた大規模な畑作を行う地域があります。北海道全体を高温の地域や急傾斜地として捉えるのは適切ではありません。"}, {"id": "so-region-connect", "options": ["冷涼な気候を利用する", "低地より高温の気候を利用する", "標高によって雨が降らなくなることを利用する"], "explanation": "標高が高い地域は一般に低地より気温が低く、夏も冷涼な気候を利用できます。標高が上がるほど高温になるわけでも、雨が降らなくなるわけでもありません。"}, {"id": "so-region-create", "options": ["同じ地点で時間帯別に人数を数える", "同じ時刻に別々の地点で人数を数える", "同じ地点で営業中の店の数だけを数える"], "explanation": "いつ多いかという時間の違いを調べるので、地点を固定して時間帯を変えます。場所ごとの比較や商店数の調査だけでは、時間帯別の人通りは分かりません。"}, {"id": "sc-plant-detect", "options": ["昼も夜も呼吸する", "昼は光合成だけを行い夜だけ呼吸する", "昼だけ呼吸し夜は呼吸しない"], "explanation": "植物は昼も夜も呼吸します。光があるときは光合成も行うので、昼は呼吸をしないという意味ではありません。二つの働きを分けて考えます。"}, {"id": "sc-plant-connect", "options": ["ヨウ素液", "ベネジクト液", "BTB溶液"], "explanation": "デンプンはヨウ素液で青紫色に反応します。ベネジクト液は特定の糖を調べる試薬、BTB溶液は酸性・中性・アルカリ性を調べる指示薬で、用途が異なります。"}, {"id": "sc-plant-create", "options": ["光を当てるかどうか", "二酸化炭素を与えるかどうか", "植物を置く温度"], "explanation": "調べたい要因が光なので、光の有無だけを変え、二酸化炭素や温度などはそろえます。他の条件を変えると、光の影響として比べにくくなります。"}, {"id": "sc-cell-connect", "options": ["組織", "器官", "個体"], "explanation": "同じような働きの細胞が集まったものが組織です。いくつかの組織が集まって一定の働きをする器官となり、器官が組み合わさって個体をつくります。"}, {"id": "sc-human-connect", "options": ["吸収する表面積が大きくなる", "小腸の内側の容積だけが大きくなる", "養分を吸収する面までの距離が長くなる"], "explanation": "多数の柔毛は養分に触れる表面積を広げます。内側の容積を大きくすることや、吸収までの距離を長くすることが主な利点ではありません。"}, {"id": "sc-ecology-detect", "options": ["遺体や排出物の分解に影響する", "分解がなくても無機物は同じ速さで戻る", "分解者が減るほど植物への無機物の供給は増える"], "explanation": "分解者は遺体や排出物などの有機物を分解し、無機物を環境へ戻す働きを担います。分解者がいなくても同じように循環するとは考えられません。"}, {"id": "ja-logic-detect", "options": ["その例が何の説明に使われているか", "その例が段落の末尾にあるかだけ", "その例が筆者本人の経験かだけ"], "explanation": "具体例が支えている説明や主張を、前後の文から確かめます。段落内の位置や本人の経験かどうかだけで、その例を結論と判断することはできません。"}, {"id": "ja-logic-create", "options": ["一人当たりの移動に伴う排出量を抑えられる場合がある", "鉄道とバスでは車両の形が異なる", "路線によって駅や停留所の間隔が異なる"], "explanation": "利用を増やすべきだという主張には、利用増によって期待できる利点が根拠になります。車両の形や停留所の間隔の違いは、公共交通についての事実でも、この主張を直接支える理由にはなっていません。"}, {"id": "ja-expression-detect", "prompt": "全校生徒300人のうち10人への調査を『全校生徒全員の意見』とした。問題は？", "options": ["調査対象から言える範囲を越えている", "10人では回答数や割合を集計することもできない", "10人の回答が一致すれば全校に一般化できる"], "explanation": "300人のうち調べたのは10人です。その10人の回答数や割合は計算できますが、選び方や規模を検討せず、残りの290人も同じ意見だとは断定できません。"}, {"id": "ja-expression-connect", "options": ["前者は測定事実、後者は感じ方", "前者は予測、後者は測定事実", "前者も後者も同じ測定値の説明"], "explanation": "20℃という気温は測定した事実を表し、過ごしやすいかは人による評価・感じ方です。同じ気温でも感じ方が異なることがあります。"}];const release="revisions-022";C.questionHistory=C.questionHistory||{};C.revisionLog=C.revisionLog||[];const seen=new Set();for(const patch of revisions){if(seen.has(patch.id))throw Error('Duplicate revision '+patch.id);seen.add(patch.id);if(Object.keys(patch).some(k=>!['id','prompt','options','explanation'].includes(k)))throw Error('Unsupported revision field');const i=C.questions.findIndex(q=>q.id===patch.id);if(i<0)throw Error('Unknown revision '+patch.id);const old=C.questions[i];const next={...old,...patch,version:(old.version||1)+1};if(!next.options||new Set(next.options).size!==next.options.length||next.options.filter(x=>x===next.answer).length!==1)throw Error('Invalid revision options '+patch.id);if(typeof next.prompt!=='string'||typeof next.explanation!=='string')throw Error('Invalid revision text');(C.questionHistory[old.id]||=[]).push(JSON.parse(JSON.stringify(old)));C.questions[i]=next;C.revisionLog.push({id:old.id,from:old.version||1,to:next.version,release});}})(typeof window==='undefined'?globalThis.TrailContent:window.TrailContent);
(function(C){const revisions=[{"id": "sc-light-connect", "options": ["正立の虚像", "倒立の実像", "正立の実像"], "explanation": "焦点より内側では、レンズを通った光を逆向きに延長した位置に、正立で拡大した虚像が見えます。光がそこで実際に集まる実像とは異なり、スクリーンには映せません。"}, {"id": "sc-electric-detect", "options": ["直列につなぐ", "並列のまま端子の極性を逆にする", "並列のまま測定範囲を大きくする"], "explanation": "抵抗を流れる電流を測るには、その電流が電流計も通るように直列につなぎます。極性や測定範囲を変えても、並列という接続の誤りは直りません。"}, {"id": "sc-electric-create", "options": ["等しい", "抵抗が大きい枝ほど大きい", "抵抗が小さい枝ほど大きい"], "explanation": "同じ二点の間につながる枝には、同じ電圧がかかります。抵抗の違いによって変わるのは各枝を流れる電流であり、枝の電圧ではありません。"}, {"id": "sc-magnet-detect", "options": ["磁界の変化が必要", "磁界が強ければ静止したままでも流れ続ける", "コイルの巻数を増やせば静止したままでも流れ続ける"], "explanation": "電磁誘導にはコイルを貫く磁界の変化が必要です。磁石とコイルが静止し磁界が変化しなければ、強い磁石や巻数の多いコイルでも誘導電流は流れ続けません。"}, {"id": "sc-magnet-create", "options": ["誘導電流の向きが逆になる", "誘導電流の向きは変わらず大きさだけが変わる", "出すときには誘導電流が流れなくなる"], "explanation": "同じ磁極を同じコイルに近づける場合と遠ざける場合では、コイルを貫く磁界の変化が逆になります。そのため誘導電流の向きも逆になります。", "prompt": "同じ磁極を同じコイルへ近づける場合と遠ざける場合で、誘導電流を比べると？"}, {"id": "sc-motion-connect", "options": ["位置エネルギーが減り運動エネルギーが増える", "位置エネルギーが増え運動エネルギーが減る", "位置エネルギーが減り運動エネルギーも減る"], "explanation": "摩擦などの抵抗を無視できるとき、力学的エネルギーは保存されます。下ることで高さが低くなり、減った位置エネルギーに対応して運動エネルギーが増えます。"}, {"id": "sc-motion-create", "options": ["距離は時間に比例する", "距離は時間の2乗に比例する", "距離は時間に反比例する"], "explanation": "出発してからの移動距離は、一定の速さに経過時間をかけた値です。時間が2倍なら距離も2倍になり、4倍になる関係や半分になる関係ではありません。"}, {"id": "sc-substance-detect", "options": ["水に溶けて集めにくい", "空気より軽いため水上置換では集めにくい", "水蒸気と区別できないため気体として集められない"], "explanation": "水上置換では気体が水と接するため、水に非常によく溶けるアンモニアは集めにくくなります。水上置換を選ぶ際は、空気との密度の違いより水への溶けやすさが重要です。"}, {"id": "sc-substance-connect", "options": ["白く濁る", "青色に変わる", "無色透明のまま変化しない"], "explanation": "二酸化炭素を少量通すと、水に溶けにくい炭酸カルシウムが生じて石灰水が白く濁ります。通し続けた場合の変化とは区別して、最初の反応を見ます。", "prompt": "透明な石灰水に二酸化炭素を少量通すと、最初にどのような変化が見られる？"}, {"id": "sc-substance-create", "options": ["質量と体積", "質量と表面積", "体積と表面積"], "explanation": "密度は単位体積あたりの質量で、質量÷体積で求めます。表面積は物体の形にも左右され、質量や体積の代わりにはできません。"}, {"id": "sc-solution-detect", "options": ["密閉して出入りがなければ質量は変わらない", "体積が増えるので質量も増える", "密度が小さくなるので質量も減る"], "explanation": "水が氷になると体積や密度は変化しますが、物質の出入りがなければ質量は保存されます。体積の変化をそのまま質量の増減と考えないことが大切です。"}, {"id": "sc-solution-create", "options": ["蒸留", "ろ過", "再結晶"], "explanation": "蒸留では沸点の違いを利用して気体にし、それを冷やして液体として集めます。ろ過は溶けていない固体を分け、再結晶は溶解度の違いを利用して結晶を取り出します。"}, {"id": "sc-oxidation-detect", "options": ["取り込んだ酸素も含めて比較する", "加熱前後の銅を含む固体だけを比べればよい", "増えた質量をすべて付着した水分として差し引く"], "explanation": "空気中の酸素が銅と結びつくため、固体だけを測ると質量が増えます。反応した酸素の質量も反応前の合計に含めると、反応後の酸化銅の質量と対応します。"}, {"id": "sc-oxidation-create", "options": ["反応前後の温度を比べる", "反応前後の気体の体積を比べる", "反応前後の沈殿の量を比べる"], "explanation": "外部から加熱せず、周囲の条件をそろえて温度変化を調べます。気体や沈殿の生成だけでは、反応で熱を放出したかどうかは判断できません。"}, {"id": "sc-ion-connect", "options": ["水", "水素", "酸素"], "explanation": "水素イオンH⁺と水酸化物イオンOH⁻が結びつくと、水H₂Oができます。中和でこの二つのイオンから直接できるものは、水素や酸素の気体ではありません。"}, {"id": "sc-ion-create", "options": ["化学エネルギーから電気エネルギー", "電気エネルギーから化学エネルギー", "光エネルギーから電気エネルギー"], "explanation": "化学電池が電流を取り出すときは、化学反応に伴うエネルギーを電気エネルギーへ変えます。充電時の逆の変換や、太陽電池による光の利用とは区別します。", "prompt": "化学電池から電流を取り出すときのエネルギーの変換は？"}, {"id": "sc-life-connect", "options": ["胸部に6本", "腹部に6本", "胸部に8本"], "explanation": "昆虫の成体の体は頭部・胸部・腹部に分かれ、胸部に3対、合計6本の脚があります。脚の位置と本数の両方を確かめましょう。"}, {"id": "sc-life-create", "options": ["胚珠が子房に包まれるか", "子葉が1枚か2枚か", "葉脈が平行脈か網状脈か"], "explanation": "被子植物は胚珠が子房の中にあり、裸子植物は胚珠がむき出しです。子葉の枚数や葉脈の違いは、被子植物の中で分類を考えるときの手掛かりです。"}, {"id": "sc-genetics-solve", "options": ["卵と精子の核が合体すること", "卵の核が二つに分かれること", "受精卵が細胞分裂を繰り返すこと"], "explanation": "受精は卵と精子の核が合体することです。その結果できた受精卵が分裂を繰り返して成長する過程は、受精そのものとは区別します。"}, {"id": "sc-earth-connect", "options": ["等粒状組織", "斑状組織", "砕屑物が層状に重なった組織"], "explanation": "地下深くでゆっくり冷えると結晶が成長し、等粒状組織になります。斑状組織は火山岩に見られ、砕屑物が積もってできる岩石は火成岩とは成り立ちが異なります。"}, {"id": "sc-weather-detect", "options": ["その温度で飽和しているという意味", "空気の質量と水蒸気の質量が等しいという意味", "どの温度でも同じ量の水蒸気を含むという意味"], "explanation": "湿度は、その温度の飽和水蒸気量に対する実際の水蒸気量の割合です。100％でも空気全体が水蒸気なのではなく、温度が変われば飽和水蒸気量も変わります。"}, {"id": "sc-weather-connect", "options": ["寒気に押し上げられる", "寒気の下にもぐり込む", "寒気と同じ高さで水平に押し出される"], "explanation": "寒冷前線では進んでくる寒気が暖気の下へ入り、暖気を押し上げます。暖気が上昇して冷えることで雲ができるというつながりも押さえます。"}, {"id": "sc-space-solve", "options": ["地球の自転", "地球の公転", "地軸の傾きの変化"], "explanation": "一日の中で星の位置が動いて見える日周運動は、主に地球の自転によります。公転によって季節ごとに見える星が変わることと区別します。"}, {"id": "sc-space-detect", "options": ["地軸の傾きによる太陽高度や昼の長さの変化", "地球と太陽の距離の変化による日射の増減", "自転する速さの季節変化による昼の長さの変化"], "explanation": "地軸が公転面に対して傾いたまま公転するため、季節によって太陽高度や昼の長さが変わります。日本の夏の暑さは、主にこれによって説明できます。", "prompt": "日本の夏が暑い主な理由を「地球が太陽に近づくから」と説明した。修正として適切なのは？"}];const release="revisions-023";C.questionHistory=C.questionHistory||{};C.revisionLog=C.revisionLog||[];const seen=new Set();for(const patch of revisions){if(seen.has(patch.id))throw Error('Duplicate revision '+patch.id);seen.add(patch.id);if(Object.keys(patch).some(k=>!['id','prompt','options','explanation'].includes(k)))throw Error('Unsupported revision field');const i=C.questions.findIndex(q=>q.id===patch.id);if(i<0)throw Error('Unknown revision '+patch.id);const old=C.questions[i];const next={...old,...patch,version:(old.version||1)+1};if(!next.options||new Set(next.options).size!==next.options.length||next.options.filter(x=>x===next.answer).length!==1)throw Error('Invalid revision options '+patch.id);if(typeof next.prompt!=='string'||typeof next.explanation!=='string')throw Error('Invalid revision text');(C.questionHistory[old.id]||=[]).push(JSON.parse(JSON.stringify(old)));C.questions[i]=next;C.revisionLog.push({id:old.id,from:old.version||1,to:next.version,release});}})(typeof window==='undefined'?globalThis.TrailContent:window.TrailContent);

return out;}

function learn(){const a=state.active;if(!a)return home();const q=a.queue[a.index],u=unit(a.unit);return `<div class="row spread"><button class="quiet" data-pause>← 保存して中断</button><small>${a.index+1} / ${a.queue.length} 課題</small></div><div class="progress"><span style="width:${(a.index+(a.feedback?1:0))/a.queue.length*100}%"></span></div><section class="card"><div class="row spread"><span class="pill">${u.subject} · ${u.name}</span><small>${C.modes[q.mode]}</small></div>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}${questionMedia(q)}<h2 class="prompt">${esc(q.prompt)}</h2>${a.feedback?'':q.options?`<div class="options">${q.options.map((o,i)=>`<button class="option" data-answer-index="${i}"><span>${i+1}</span>${esc(o)}</button>`).join('')}</div>`:`<form id="answer-form" class="input-row"><input id="answer-input" aria-label="${esc(q.inputLabel||'解答')}" inputmode="${q.grading==='number'||q.grading==='short_text'?'text':'decimal'}" autocomplete="off" value="${esc(a.draft)}" placeholder="${esc(q.inputPlaceholder||(q.grading==='number'?'整数・小数・分数':'数を入力'))}"><button type="submit">確かめる →</button></form>`}${a.inputError?`<p role="alert" class="notice">${esc(a.inputError)}</p>`:''}${!a.feedback?`<div class="row" style="margin-top:20px"><button class="quiet" data-hint>${a.hint&&q.hints?(a.hintStep>=q.hints.length?'ヒントを表示中':'次のヒントを見る'):'考え方をヒントにする'}</button><button class="quiet" data-unlearned>まだ習っていない</button></div>${a.hint?`<div class="notice">${q.hints?q.hints.slice(0,a.hintStep||1).map((h,i)=>`<p>ヒント${i+1}：${esc(h)}</p>`).join(''):u.lesson}</div>`:''}${a.taught?`<div class="notice"><strong>考え方の入口</strong><p>${u.lesson}</p>${a.unit==='math-equation'?'<p>例：2x＋3＝11なら、両辺から3を引いて2x＝8、両辺を2で割ってx＝4。元の式に4を入れて、左右が11になるか確かめます。</p>':''}</div><p class="subtle">説明を使って学習中。ポイントは変わりません。</p>`:''}`:`<div class="feedback ${a.feedback.ok?'':'review'}" role="status"><h3>${a.feedback.ok?'✓ 確かめられた！':'ここから、考え直そう。'}</h3><p><strong>${esc(a.feedback.answer)}</strong></p><p>${esc(a.feedback.explanation)}</p>${!a.feedback.ok?`<label class="checkline"><input type="checkbox" id="review-check" ${a.review?'checked':''}>考え方を確かめた</label>`:''}<button data-next ${!a.feedback.ok&&!a.review?'disabled':''}>${a.index+1===a.queue.length?'今回の発見を見る':'次の挑戦へ'} →</button></div>`}</section><p class="subtle">今回のセット完了で ${a.queue.length} pt。正解数・ヒント利用による減点はありません。</p>`;}
function spellCard(a){const date=state.awards.find(x=>x.id===a.id)?.at;return `<article class="award spell-card tone-${a.element}"><div class="spell-meta"><span>術式 ${String(E.awards.indexOf(a)+1).padStart(3,'0')}</span></div><div class="sigil"><span>${a.mark}</span></div><h3>${a.name}</h3><p>${a.incantation}</p><small>${date?fmt(date)+' 習得':''}</small></article>`;}

function abilities(){const subjects=['数学','英語','国語','理科','社会'],labels=['構築の知識','詠唱の知識','解読の知識','現象の知識','世界の知識'];return `<div class="abilities">${subjects.map((subject,i)=>{let us=C.units.filter(u=>u.subject===subject),ids=new Set(us.map(u=>u.id)),n=state.sessions.filter(x=>ids.has(x.unit)).length;return `<button data-subject="${subject}" class="ability"><span>${us[0].icon}</span><b>${labels[i]}</b><small>${subject} · 修練 ${n}回</small></button>`;}).join('')}</div>`;}
function collection(){const visible=state.awards.slice().reverse().map(x=>award(x.id)).filter(Boolean);let hints=E.awards.filter(a=>!state.awards.some(x=>x.id===a.id)).filter((a,i)=>i%5===0).slice(0,3);return `<div class="intro"><div><div class="eyebrow">YOUR PERSONAL GRIMOIRE</div><h1>自分だけの、魔導書。</h1><p class="muted">${visible.length}種の呪文を習得。</p></div></div><div class="card"><h3>魔法を支える知識</h3><p class="subtle">修練の記録が、知識として積み上がる。呪文の習得条件は、まだ秘密。</p>${abilities()}</div><div class="awardgrid">${visible.slice(0,collectionLimit).map(spellCard).join('')}${hints.map(a=>`<article class="award locked"><div class="sigil"><span>?</span></div><h3>封じられた術式</h3><p>${a.hint}</p><small>習得条件は未解明</small></article>`).join('')}</div>${visible.length>collectionLimit?'<button id="more-spells" class="secondary">さらに開く</button>':''}<p class="subtle">すべての術式が見えているわけではありません。新しい知識が、次の発見につながります。</p>`;}

function records(){return `<div class="intro"><div><div class="eyebrow">RECORD OF PRACTICE</div><h1>積み重ねは、残っている。</h1></div></div>${levelCard()}${numbers()}<div class="card"><h2>取り組んだ単元</h2><p class="subtle">${new Set(state.attempts.map(a=>a.unit)).size} / ${C.units.length} 単元に挑戦</p>${C.units.filter(u=>state.attempts.some(a=>a.unit===u.id)).map(u=>{let h=state.attempts.filter(a=>a.unit===u.id),p=E.progress(state,u.id);return `<div class="record row spread"><div><b>${u.name}</b><small>${p.label} · ${h.length}回の挑戦</small></div><a href="#unit/${u.id}">もう一度 ↗</a></div>`}).join('')}<p class="subtle">「複数の角度で確認」は、日を置いた自力の正解を含む状態です。単元全体の習得完了を意味しません。</p></div><div class="card"><h2>最近の修練</h2>${state.sessions.slice(-15).reverse().map(s=>`<div class="record"><b>${unit(s.unit).name}</b><small>${fmt(s.at)} · ${s.count}課題 · ${s.modes.map(m=>C.modes[m]).join(' / ')}</small></div>`).join('')||'<p class="muted">最初の一歩が、ここに記録されます。</p>'}</div>${state.legacy.length?`<div class="notice">旧版の解答履歴を ${state.legacy.length} 件保管しています。新しい習得判定とポイントには換算していません。</div>`:''}`;}
function family(){const p=E.totals(state),recent=state.awards.slice(-3).reverse().map(x=>award(x.id)).filter(Boolean);return `<section class="card family mage-profile"><div class="eyebrow">MAGE PORTRAIT</div><div class="mage-avatar" aria-hidden="true">✧</div><h1>${esc(state.name)}</h1><p class="muted">${state.awards.length}種の呪文を記した魔法使い</p>${levelCard()}<div class="eyebrow" style="margin-top:25px">今週の取り組み</div><div class="bigscore">${p.week}<small>pt</small></div><p class="muted">修練を終えた分だけ、積み上がる。</p><div class="sectionhead"><h2>最近習得した呪文</h2><a href="#collection">魔導書を見る ↗</a></div>${recent.length?`<div class="awardgrid">${recent.map(spellCard).join('')}</div>`:'<p class="subtle">修練で習得した呪文が、ここに記録されます。</p>'}${numbers()}<p class="subtle">レベル、習得した呪文、今週の取り組みを家族で見せ合おう。<br>週間集計は日本時間・月曜始まり。端末間の自動共有はありません。</p></section>`;}

function settings(){return `<div class="intro"><div><div class="eyebrow">MAGE SETTINGS</div><h1>記録・設定</h1></div></div><div class="card"><h2>プロフィール</h2><label for="name">表示名</label><div class="input-row"><input id="name" maxlength="24" value="${esc(state.name)}"><button id="save-name">保存</button></div></div><div class="card"><h2>記録を守る</h2><p class="subtle">機種変更やブラウザのデータ削除に備えて、ファイルで保存できます。復元前の記録を一つ退避してから置き換えます。間違えた場合は下の退避記録から戻せます。</p><div class="row"><button id="export">バックアップを書き出す</button><button class="secondary" id="restore">バックアップを復元</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>${storageBlocked?'<button class="secondary" id="rescue">読み込めなかった保存データを救出</button>':''}</div>${recoveryPanel()}<div class="card"><h2>旧版の履歴を保管</h2><p class="subtle">旧アプリで書き出したJSONを取り込めます。原記録を保管し、新しいポイントや習得度には自動換算しません。</p><button class="secondary" id="legacy">旧版の記録を読み込む</button><input type="file" id="legacy-file" accept=".json,application/json" hidden></div><div class="card"><h2>お小遣いとの交換記録</h2><p class="subtle">換算レートは未設定です。家族で決めた後、実際に受け取った交換だけを記録してください。</p><p>交換可能：<b>${E.totals(state).balance} pt</b></p><label for="redeem-amount">交換に使ったポイント</label><input id="redeem-amount" type="number" min="1" step="1" placeholder="ポイント"><label for="redeem-note">メモ（任意）</label><input id="redeem-note" maxlength="100" placeholder="例：お小遣いを受け取った"><div><button class="secondary" id="redeem" style="margin-top:16px">交換を記録する</button></div>${state.ledger.filter(x=>x.kind==='redeem').slice(-8).reverse().map(x=>`<div class="record">${-x.amount} pt 交換<small>${fmt(x.at)} ${esc(x.note)}</small></div>`).join('')}</div>`;}
function done(){if(!lastResult)return home();const r=lastResult;return `<div class="card done"><div class="seal">✳</div><div class="eyebrow">PRACTICE COMPLETE</div><h1>知識が、魔法に変わる。</h1><p class="muted">${unit(r.unit).name}の挑戦を完了しました。</p><div class="score">+ ${r.amount} <small>pt</small></div><div class="subtle">+ ${r.xp} XP</div>${r.afterLevel>r.beforeLevel?`<div class="level-up">LEVEL UP · Lv. ${r.beforeLevel} → Lv. ${r.afterLevel}<br>${E.mageLevel(state).rank}</div>`:''}${levelCard()}${r.unlocked.length?`<div class="notice"><b>新しい呪文を習得しました！</b><p>${r.unlocked.map(id=>`${award(id).mark} ${award(id).name}`).join(' ／ ')}</p></div>`:''}<div class="row"><button data-go="collection" class="secondary">魔導書を開く</button><button data-start="">修練を続ける →</button><button class="secondary" data-go="explore">別の科目・単元を選ぶ</button><button class="quiet" data-go="home">今日はここまで</button></div><p class="subtle">続けた分だけ積み上がります。一日のポイント上限はありません。</p></div>`;}
function start(id,mode){if(storageBlocked){toast('記録・設定から保存データを復元してください。');return;}if(state.active){if(!id||id===state.active.unit){go('learn');return;}const candidate=E.makeSession(state,id,mode||null);if(!candidate){modal('この単元は今日の課題を一巡しました','<p>途中の学習はそのまま残っています。他の単元を選ぶか、続きから再開できます。</p>');return;}modal('この単元に切り替える？',`<p>「${esc(unit(state.active.unit).name)}」の途中セットを終了して、「${esc(unit(id).name)}」を始めます。</p><p>回答済みの履歴は残ります。この途中セットの完了ポイントは付きません。獲得済みのポイントは減りません。</p><div class="row"><button id="confirm-subject-switch">切り替えて始める</button><button class="secondary" id="keep-learning">元の学習を続ける</button></div>`);$('confirm-subject-switch').onclick=()=>{const previous=state.active;state.active=candidate;if(!save()){state.active=previous;toast('保存できなかったため、切り替えを中止しました。');return;}$('dialog').close();go('learn');};$('keep-learning').onclick=()=>{$('dialog').close();go('learn');};return;}
let a=E.makeSession(state,id||null,mode||null);if(!a){modal('別の景色へ進もう','<p>この選び方では、今日の新しい課題を一巡しました。別の学び方や単元を選べます。日を置くと復習として戻れます。</p>');return;}state.active=a;save();go('learn');}
function download(obj,name){let url=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function subjectNavigation(page,route){const current=page==='learn'?unit(state.active?.unit)?.subject:page==='unit'?unit(route.split('/')[1])?.subject:page==='explore'?filters.subject:'';return `<div class="subject-switcher" aria-label="科目を切り替える"><span class="subject-switcher-label">科目を選ぶ</span><div class="subject-buttons">${['数学','英語','国語','理科','社会'].map(subject=>`<button data-subject="${subject}" aria-pressed="${subject===current}" class="${subject===current?'selected':''}">${subject}</button>`).join('')}</div></div>`;}
function render(){let route=location.hash.slice(1)||'home',page=route.split('/')[0];$('breadcrumb').textContent=({home:'今日の修練',explore:'知識の書庫',unit:'単元の入口',learn:'挑戦の途中',collection:'自分だけの魔導書',records:'学びの足跡',settings:'魔法使いの支度',family:'家族に見せる',done:'今回の成果'})[page]||'今日の修練';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(page==='unit'?'explore':page)));$('subject-navigation').innerHTML=subjectNavigation(page,route);$('app').innerHTML=({home,explore,collection,records,settings,family,learn,done}[page]||(()=>unitPage(route.split('/')[1])))();bind();}
function bind(){
document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{save();filters={subject:b.dataset.subject,sub:'',grade:'',query:'',due:false,scope:false};go('explore');});
for(const k of ['subject','sub','grade','due','scope'])if($('filter-'+k))$('filter-'+k).onchange=e=>{filters[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='subject')filters.sub='';render();};
if($('filter-query'))$('filter-query').oninput=e=>{filters.query=e.target.value.trim();const us=matchingUnits();$('unit-results').innerHTML=us.map(unitCard).join('')||'<p class="muted">該当する単元がありません。</p>';$('filter-count').textContent=us.length+'単元を表示 · テスト範囲は単元の入口で指定できます。';};
document.querySelectorAll('[data-exam-unit]').forEach(b=>b.onchange=()=>{const ids=new Set(state.examScope||[]);b.checked?ids.add(b.dataset.examUnit):ids.delete(b.dataset.examUnit);state.examScope=[...ids];save();});
if($('more-spells'))$('more-spells').onclick=()=>{collectionLimit+=24;render();};
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.startMode));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(null,b.dataset.mode));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>go('learn'));document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>{let [id,status]=b.dataset.school.split(':');state.school[id]={status,at:Date.now()};save();render();});
const pause=document.querySelector('[data-pause]');if(pause)pause.onclick=()=>{save();modal('途中の学習は保存しました','<p>後で同じところから再開できます。別の挑戦に切り替える場合は、このセットの未完了分を終了します。回答済みの履歴は残り、完了ポイントは付きません。</p><div class="row"><button id="pause-home">ホームへ</button><button class="secondary" id="switch-unit">このセットを終了して探索へ</button></div>');$('pause-home').onclick=()=>{$('dialog').close();go('home');};$('switch-unit').onclick=()=>{state.active=null;save();$('dialog').close();go('explore');};};
document.querySelectorAll('[data-answer-index]').forEach(b=>b.onclick=()=>{const a=state.active;E.answer(state,a.queue[a.index].options[+b.dataset.answerIndex]);save();render();});
if($('answer-input'))$('answer-input').oninput=e=>{state.active.draft=e.target.value;save();};if($('answer-form'))$('answer-form').onsubmit=e=>{e.preventDefault();E.answer(state,$('answer-input').value);save();render();};
const hint=document.querySelector('[data-hint]');if(hint)hint.onclick=()=>{state.active.hint=true;state.active.hintStep=Math.min((state.active.hintStep||0)+1,state.active.queue[state.active.index].hints?.length||1);save();render();};const untaught=document.querySelector('[data-unlearned]');if(untaught)untaught.onclick=()=>{state.active.taught=true;state.active.hint=true;state.active.hintStep=1;state.school[state.active.unit]={status:'unlearned',at:Date.now()};save();render();};
if($('review-check'))$('review-check').onchange=e=>{state.active.review=e.target.checked;save();document.querySelector('[data-next]').disabled=!e.target.checked;};const next=document.querySelector('[data-next]');if(next)next.onclick=()=>{let r=E.advance(state);save();if(r?.done){lastResult=r;go('done');}else render();};
if($('save-name'))$('save-name').onclick=()=>{state.name=$('name').value.trim()||'見習い魔法使い';save();toast('表示名を保存しました。');};if($('export'))$('export').onclick=()=>download(state,'study-trail-backup-'+E.day(Date.now())+'.json');if($('rescue'))$('rescue').onclick=()=>download(localStorage.getItem(KEY)||'','study-trail-rescue.json');
if($('restore'))$('restore').onclick=()=>$('import-file').click();if($('import-file'))$('import-file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('20MB以下のファイルを指定してください。');pendingImport=E.validate(JSON.parse(await f.text()));modal('バックアップを復元しますか？',`<p>${esc(pendingImport.name)}の ${pendingImport.sessions.length} セットの記録です。現在の記録を退避してから置き換えます。ファイルでも残しておくと安心です。</p><button id="confirm-import">この内容に置き換える</button>`);$('confirm-import').onclick=()=>{try{state=recovery.replace(pendingImport);}catch(e){toast('現在の記録の退避または保存ができないため、復元を中止しました。');return;}storageBlocked=false;pendingImport=null;$('storage-warning').textContent='';$('dialog').close();render();toast('復元しました。');};}catch(err){modal('読み込めません',`<p>${esc(err.message)}</p>`);}};
if($('export-recovery'))$('export-recovery').onclick=()=>{try{const item=recovery.inspect();if(item)download(item.raw,'study-trail-before-restore.json');}catch(e){toast('退避記録を読み込めません。');}};
if($('undo-restore'))$('undo-restore').onclick=()=>{try{const item=recovery.inspect();if(!item?.state)throw Error('退避記録を復元できません。');modal('置き換える前に戻しますか？',`<p>${esc(item.state.name)}の ${item.state.sessions.length} セットの記録に戻します。現在の記録を新しい退避として残します。</p><button id="confirm-undo">この記録に戻す</button>`);$('confirm-undo').onclick=()=>{try{state=recovery.undo();storageBlocked=false;$('storage-warning').textContent='';$('dialog').close();render();toast('置き換える前の記録に戻しました。');}catch(e){toast('退避または保存ができないため中止しました。');}};}catch(e){toast(e.message);}};
if($('legacy'))$('legacy').onclick=()=>$('legacy-file').click();if($('legacy-file'))$('legacy-file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('20MB以下を指定してください。');let v=JSON.parse(await f.text());if(v.kind!=='midterm-backup'||![1,2].includes(v.schemaVersion)||!Array.isArray(v.history)||v.history.length>100000||v.history.some(x=>!x||typeof x.skill!=='string'||typeof x.ok!=='boolean'||!Number.isFinite(x.at)))throw Error('旧版の全記録バックアップを指定してください。');let seen=new Set(state.legacy.map(x=>JSON.stringify(x)));for(const x of v.history){let k=JSON.stringify(x);if(!seen.has(k)){state.legacy.push(x);seen.add(k);}}save();render();toast('旧版の履歴を保管しました。');}catch(err){modal('読み込めません',`<p>${esc(err.message)}</p>`);}};
if($('redeem'))$('redeem').onclick=()=>{let amount=Number($('redeem-amount').value),note=$('redeem-note').value;if(!Number.isSafeInteger(amount)||amount<=0||amount>E.totals(state).balance){toast('残高以内の正の整数を入力してください。');return;}modal('受け取りを確認',`<p>${amount} pt を交換済みとして記録します。実際のお小遣いは受け取りましたか？</p><button id="confirm-redeem">受け取ったので記録する</button>`);$('confirm-redeem').onclick=()=>{try{E.redeem(state,amount,note);save();$('dialog').close();render();}catch(e){toast(e.message);}};};}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{state=E.validate(JSON.parse(e.newValue));render();toast('別のタブで保存された最新の記録に更新しました。');}catch(err){storageBlocked=true;$('storage-warning').textContent='別のタブの記録を読み込めません。バックアップ後に再読み込みしてください。';}});
window.addEventListener('hashchange',render);render();
})();
</script></body></html>
