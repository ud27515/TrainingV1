</style></head><body><div class="shell"><aside><a class="brand" href="#home"><span class="brandmark">✳</span><span>魔導書のアトリエ<small>THE GRIMOIRE ATELIER</small></span></a><nav aria-label="メイン"><a href="#home">⌂ <span>ホーム</span></a><a href="#explore">⌘ <span>知識の書庫</span></a><a href="#collection">◇ <span>魔導書</span></a><a href="#records">↗ <span>学びの記録</span></a><a href="#settings">⚙ <span>記録・設定</span></a></nav><div class="aside-note">知識を集めて、<br>自分だけの魔法を。<small>五教科・魔法版 0.15</small></div></aside><div class="workspace"><header><span id="breadcrumb">今日の修練</span><button class="profile" id="family">家族に見せる ↗</button></header><div id="storage-warning" role="alert"></div><main id="app"></main><footer>記録はこのブラウザに保存されます。定期的にバックアップを。<br>中学の主要単元を収録。学年は目安です。学校ごとの全範囲・発展問題への対応は拡充中です。</footer></div></div><div id="toast" role="status"></div><dialog id="dialog"><div id="dialog-content"></div><button id="close-dialog" class="secondary">閉じる</button></dialog><script>(function(root){

{id:'math-equation',subject:'数学',sub:'代数',name:'一次方程式',icon:'𝑥',color:'#bd7655',summary:'式の向こうにある関係を見つけよう。',lesson:'方程式は、文字に特定の値を入れると成り立つ等式です。両辺に同じ数を足す・引く、同じ0でない数を掛ける・割ると、等しさを保てます。例えば 3x + 2 = 14 なら、両辺から2を引き、3で割ると x = 4。最後に元の式へ戻して確かめます。',tags:['relation','number']},
{id:'english-question',subject:'英語',sub:'文法・コミュニケーション',name:'疑問文と応答',icon:'Aa',color:'#688bb8',summary:'知りたいことにぴったりの問いを。',lesson:'人なら Who、場所なら Where、時なら When、だれの物かなら Whose を使います。一般動詞の疑問文は Do / Does + 主語 + 動詞の原形。Does Ken play tennis? のように、does があると play に s は付けません。質問と答えの意味のつながりも確かめましょう。',tags:['language','relation']},
{id:'japanese-evidence',subject:'国語',sub:'国語3・現代文',name:'根拠から読み解く',icon:'文',color:'#9a7ca8',summary:'書かれていることから、考えをたどる。',lesson:'読解では、本文の事実と自分の推測を分けます。「しかし」は対比、「だから」は理由と結果の手掛かり。「これ・それ」の指す内容は前の文を探します。要約は、中心の考えと重要な関係を残し、例や細部を短くまとめます。',tags:['language','evidence']},

C.units.push(...[{"id": "en-be", "subject": "英語", "sub": "文法", "name": "be動詞と一般動詞", "grade": 1, "prerequisites": [], "lesson": "be動詞は状態や身元を、一般動詞は動作や習慣などを表します。主語に合わせて形を選び、否定・疑問の作り方を区別しましょう。", "summary": "be動詞は状態や身元を、一般動詞は動作や習慣などを表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-noun", "subject": "英語", "sub": "文法", "name": "名詞・代名詞・冠詞", "grade": 1, "prerequisites": ["en-be"], "lesson": "名詞の単数・複数、aとan、主語・目的語・所有を表す代名詞を区別します。形は文の中での役割で決まります。", "summary": "名詞の単数・複数、aとan、主語・目的語・所有を表す代名詞を区別します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-present", "subject": "英語", "sub": "文法", "name": "現在形・頻度・命令文", "grade": 1, "prerequisites": ["en-be"], "lesson": "主語が三人称単数の現在形では一般動詞にsなどを付けます。命令文は動詞の原形で始め、禁止はDon'tで始めます。", "summary": "主語が三人称単数の現在形では一般動詞にsなどを付けます。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-progressive", "subject": "英語", "sub": "文法", "name": "進行形", "grade": 1, "prerequisites": ["en-be"], "lesson": "進行形はbe動詞＋動詞のing形です。現在進行形は今していること、過去進行形は過去のある時点でしていたことを表します。", "summary": "進行形はbe動詞＋動詞のing形です。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-past", "subject": "英語", "sub": "文法", "name": "過去形", "grade": 1, "prerequisites": ["en-present"], "lesson": "過去形には規則変化と不規則変化があります。didを使う疑問文や否定文では一般動詞を原形に戻します。", "summary": "過去形には規則変化と不規則変化があります。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-future-modal", "subject": "英語", "sub": "文法", "name": "未来・助動詞", "grade": 2, "prerequisites": ["en-present"], "lesson": "willやcanの後は動詞の原形。mustは義務、must notは禁止、don't have toは必要がないことを表します。", "summary": "willやcanの後は動詞の原形。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-infinitive", "subject": "英語", "sub": "文法", "name": "不定詞", "grade": 2, "prerequisites": ["en-present"], "lesson": "to＋動詞の原形は「すること」「するための」「するために」などを表します。文中で何を説明しているかを見ます。", "summary": "to＋動詞の原形は「すること」「するための」「するために」などを表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-gerund", "subject": "英語", "sub": "文法", "name": "動名詞・文型", "grade": 2, "prerequisites": ["en-infinitive"], "lesson": "動詞のing形を名詞のように使うと「すること」を表します。enjoyの後や前置詞の後では動名詞を使います。", "summary": "動詞のing形を名詞のように使うと「すること」を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-comparison", "subject": "英語", "sub": "文法", "name": "比較", "grade": 2, "prerequisites": ["en-be"], "lesson": "比較級は二つを比べ、最上級は範囲内で最も高い程度を表します。as...asは同程度。比較する範囲や対象を確かめます。", "summary": "比較級は二つを比べ、最上級は範囲内で最も高い程度を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-passive", "subject": "英語", "sub": "文法", "name": "受け身", "grade": 3, "prerequisites": ["en-past"], "lesson": "受け身はbe動詞＋過去分詞で「される」を表します。動作を受ける側が主語になります。", "summary": "受け身はbe動詞＋過去分詞で「される」を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-perfect", "subject": "英語", "sub": "文法", "name": "現在完了・完了進行形", "grade": 3, "prerequisites": ["en-past"], "lesson": "現在完了はhave/has＋過去分詞で、過去と現在のつながりを表します。継続・経験・完了を文脈で区別し、完了進行形はhave been＋ingです。", "summary": "現在完了はhave/has＋過去分詞で、過去と現在のつながりを表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-relative", "subject": "英語", "sub": "文法", "name": "分詞・関係代名詞", "grade": 3, "prerequisites": ["en-passive"], "lesson": "名詞を後ろから説明する表現があります。関係代名詞は先行詞と節を結び、分詞も動作や状態で名詞を修飾します。", "summary": "名詞を後ろから説明する表現があります。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-clause", "subject": "英語", "sub": "文法", "name": "接続詞・間接疑問・仮定法の基礎", "grade": 3, "prerequisites": ["en-future-modal"], "lesson": "接続詞は文の関係を表します。間接疑問では疑問詞の後が主語＋動詞の語順になります。仮定法では現実と異なる仮定を表す形を学びます。", "summary": "接続詞は文の関係を表します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-reading", "subject": "英語", "sub": "コミュニケーション", "name": "短文読解・必要な情報", "grade": 2, "prerequisites": ["en-past"], "lesson": "読解では、時・場所・人・目的を整理し、本文に書かれたことと推測を区別します。", "summary": "読解では、時・場所・人・目的を整理し、本文に書かれたことと推測を区別します。", "icon": "✧", "color": "#9db3ff"}, {"id": "en-dialogue", "subject": "英語", "sub": "コミュニケーション", "name": "会話・依頼・意見を伝える", "grade": 2, "prerequisites": ["english-question"], "lesson": "会話では相手の目的を捉え、返答の内容を合わせます。意見には理由を添え、分からないときは聞き返します。", "summary": "会話では相手の目的を捉え、返答の内容を合わせます。", "icon": "✧", "color": "#9db3ff"}, {"id": "ma-signed", "subject": "数学", "sub": "代数", "name": "正負の数", "grade": 1, "prerequisites": [], "lesson": "負の数を引くことは、その反対の数を足すことです。乗除は符号と絶対値を分けて考え、計算の順序を守ります。", "summary": "負の数を引くことは、その反対の数を足すことです。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-expression", "subject": "数学", "sub": "代数", "name": "文字式・式の値", "grade": 1, "prerequisites": ["ma-signed"], "lesson": "文字式では掛け算の記号を省き、数を前に書きます。同類項は係数をまとめ、代入するときは負の数を括弧に入れます。", "summary": "文字式では掛け算の記号を省き、数を前に書きます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-ratio", "subject": "数学", "sub": "代数", "name": "割合・比と方程式の利用", "grade": 1, "prerequisites": ["math-equation"], "lesson": "割合を小数や分数に直し、何を基準にしているかを確認します。比では対応する量の関係を保ちます。", "summary": "割合を小数や分数に直し、何を基準にしているかを確認します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-proportion", "subject": "数学", "sub": "代数", "name": "比例・反比例", "grade": 1, "prerequisites": ["ma-expression"], "lesson": "比例はy=ax、反比例はy=a/xで表します。比例ではy/x、反比例ではxyが一定です。", "summary": "比例はy=ax、反比例はy=a/xで表します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-simultaneous", "subject": "数学", "sub": "代数", "name": "連立方程式", "grade": 2, "prerequisites": ["math-equation"], "lesson": "二つの式を同時に満たす組を求めます。加減法や代入法で文字を一つ消し、解を両方の式に戻して確かめます。", "summary": "二つの式を同時に満たす組を求めます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-linear", "subject": "数学", "sub": "代数", "name": "一次関数", "grade": 2, "prerequisites": ["ma-proportion"], "lesson": "一次関数y=ax+bでaは変化の割合、bはy切片です。表やグラフの二点から増加量の比を求めます。", "summary": "一次関数y=ax+bでaは変化の割合、bはy切片です。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-expand", "subject": "数学", "sub": "代数", "name": "展開・因数分解", "grade": 3, "prerequisites": ["ma-expression"], "lesson": "展開は積を和へ、因数分解は和を積へ直します。共通因数や乗法公式を使い、逆に展開して確かめます。", "summary": "展開は積を和へ、因数分解は和を積へ直します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-root", "subject": "数学", "sub": "代数", "name": "平方根", "grade": 3, "prerequisites": ["ma-signed"], "lesson": "平方根は二乗するとその数になる数。√aは非負の平方根を表します。根号の中の平方因数を外に出して整理します。", "summary": "平方根は二乗するとその数になる数。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-quadratic-eq", "subject": "数学", "sub": "代数", "name": "二次方程式", "grade": 3, "prerequisites": ["ma-expand", "ma-root"], "lesson": "二次方程式は因数分解、平方根、解の公式などで解きます。積が0なら少なくとも一方が0です。解を落とさないようにします。", "summary": "二次方程式は因数分解、平方根、解の公式などで解きます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-quadratic-fn", "subject": "数学", "sub": "代数", "name": "関数y=ax²", "grade": 3, "prerequisites": ["ma-linear", "ma-root"], "lesson": "y=ax²ではxが2倍になるとyは4倍になります。グラフはy軸に対称で、変化の割合は区間によって変わります。", "summary": "y=ax²ではxが2倍になるとyは4倍になります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-data", "subject": "数学", "sub": "代数", "name": "データの整理・代表値", "grade": 1, "prerequisites": [], "lesson": "平均値・中央値・最頻値は異なる特徴を表します。極端な値の影響やデータの並びを確認し、目的に合う代表値を選びます。", "summary": "平均値・中央値・最頻値は異なる特徴を表します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-probability", "subject": "数学", "sub": "代数", "name": "確率", "grade": 2, "prerequisites": ["ma-ratio"], "lesson": "同様に確からしい場合の数を数え、求める場合の数を全体で割ります。順序を区別するか、取り出した物を戻すかを確かめます。", "summary": "同様に確からしい場合の数を数え、求める場合の数を全体で割ります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ma-sampling", "subject": "数学", "sub": "代数", "name": "四分位範囲・標本調査", "grade": 3, "prerequisites": ["ma-data"], "lesson": "箱ひげ図では中央値と四分位数などを読みます。標本調査は母集団から偏りなく選んだ一部を使って全体を推測します。", "summary": "箱ひげ図では中央値と四分位数などを読みます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-plane", "subject": "数学", "sub": "幾何", "name": "平面図形・作図・移動", "grade": 1, "prerequisites": [], "lesson": "平行移動・回転移動・対称移動は図形の形と大きさを保ちます。垂直二等分線上の点は線分の両端から等距離です。", "summary": "平行移動・回転移動・対称移動は図形の形と大きさを保ちます。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-solid", "subject": "数学", "sub": "幾何", "name": "空間図形・表面積・体積", "grade": 1, "prerequisites": ["ge-plane"], "lesson": "柱体の体積は底面積×高さ、錐体はその1/3。表面積は各面の面積の合計です。高さは底面への垂直距離です。", "summary": "柱体の体積は底面積×高さ、錐体はその1/3。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-angle", "subject": "数学", "sub": "幾何", "name": "平行線と多角形の角", "grade": 2, "prerequisites": ["ge-plane"], "lesson": "平行線では同位角と錯角が等しくなります。三角形の内角の和は180°、n角形は(n−2)×180°です。", "summary": "平行線では同位角と錯角が等しくなります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-congruence", "subject": "数学", "sub": "幾何", "name": "合同と証明", "grade": 2, "prerequisites": ["ge-angle"], "lesson": "合同の証明では、対応する頂点をそろえ、条件がどの合同条件を満たすかを示します。図の見た目だけを根拠にしません。", "summary": "合同の証明では、対応する頂点をそろえ、条件がどの合同条件を満たすかを示します。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-quadrilateral", "subject": "数学", "sub": "幾何", "name": "三角形・四角形の性質", "grade": 2, "prerequisites": ["ge-congruence"], "lesson": "二等辺三角形の底角は等しく、平行四辺形の対辺・対角は等しいなどの性質があります。性質と成立条件を区別します。", "summary": "二等辺三角形の底角は等しく、平行四辺形の対辺・対角は等しいなどの性質があります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-similarity", "subject": "数学", "sub": "幾何", "name": "相似・面積比・体積比", "grade": 3, "prerequisites": ["ge-congruence"], "lesson": "相似では対応する辺の比が等しく、対応する角が等しくなります。相似比a:bなら面積比a²:b²、体積比a³:b³です。", "summary": "相似では対応する辺の比が等しく、対応する角が等しくなります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-circle", "subject": "数学", "sub": "幾何", "name": "円周角・接線", "grade": 3, "prerequisites": ["ge-angle"], "lesson": "同じ弧に対する円周角は等しく、中心角の半分です。直径に対する円周角は90°。接線と接点への半径は垂直です。", "summary": "同じ弧に対する円周角は等しく、中心角の半分です。", "icon": "⌘", "color": "#79b8f1"}, {"id": "ge-pythagoras", "subject": "数学", "sub": "幾何", "name": "三平方の定理", "grade": 3, "prerequisites": ["ma-root", "ge-similarity"], "lesson": "直角三角形では斜辺の二乗が他の二辺の二乗の和になります。直角の位置と斜辺を先に確認します。", "summary": "直角三角形では斜辺の二乗が他の二辺の二乗の和になります。", "icon": "⌘", "color": "#79b8f1"}, {"id": "sc-light", "subject": "理科", "sub": "物理・化学", "name": "光の反射・屈折・凸レンズ", "grade": 1, "prerequisites": [], "lesson": "光は境界で反射・屈折します。角度は面に立てた垂線から測ります。凸レンズでは物体と焦点の位置関係で像の性質が変わります。", "summary": "光は境界で反射・屈折します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-force", "subject": "理科", "sub": "物理・化学", "name": "力・圧力・浮力", "grade": 1, "prerequisites": [], "lesson": "力は大きさ・向き・作用点を持ちます。同じ物体に働く2力のつり合いは同一直線上・逆向き・同じ大きさ。圧力は面積あたりの力です。", "summary": "力は大きさ・向き・作用点を持ちます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-electric", "subject": "理科", "sub": "物理・化学", "name": "電流・電圧・抵抗", "grade": 2, "prerequisites": ["ma-proportion"], "lesson": "電流は電荷の流れ。オームの法則V=RIを使い、直列では電流、並列では各枝の電圧が等しいことを利用します。", "summary": "電流は電荷の流れ。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-magnet", "subject": "理科", "sub": "物理・化学", "name": "電力・磁界・電磁誘導", "grade": 2, "prerequisites": ["sc-electric"], "lesson": "電力は電圧×電流、電力量は電力×時間です。電流は磁界を作り、コイルを貫く磁界の変化は誘導電流を生みます。", "summary": "電力は電圧×電流、電力量は電力×時間です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-motion", "subject": "理科", "sub": "物理・化学", "name": "運動・仕事・エネルギー", "grade": 3, "prerequisites": ["sc-force"], "lesson": "運動は位置の時間変化で調べます。力が働く向きに動いた距離との積が仕事。摩擦などがなければ力学的エネルギーが保存されます。", "summary": "運動は位置の時間変化で調べます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-substance", "subject": "理科", "sub": "物理・化学", "name": "物質・密度・気体", "grade": 1, "prerequisites": [], "lesson": "密度は質量÷体積です。気体の集め方は水への溶けやすさと空気に対する密度で選びます。", "summary": "密度は質量÷体積です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-solution", "subject": "理科", "sub": "物理・化学", "name": "水溶液・溶解度・状態変化", "grade": 1, "prerequisites": ["sc-substance"], "lesson": "溶解度は一定量の溶媒に溶ける溶質の限度です。状態変化では物質そのものの種類は変わらず、質量は保存されます。", "summary": "溶解度は一定量の溶媒に溶ける溶質の限度です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-reaction", "subject": "理科", "sub": "物理・化学", "name": "原子・分子・化学変化", "grade": 2, "prerequisites": ["sc-substance"], "lesson": "化学変化では原子の組み合わせが変わります。原子の種類と数が保存されるように化学反応式の係数をそろえます。", "summary": "化学変化では原子の組み合わせが変わります。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-oxidation", "subject": "理科", "sub": "物理・化学", "name": "酸化・還元と熱", "grade": 2, "prerequisites": ["sc-reaction"], "lesson": "酸素と結びつく変化を酸化、酸化物から酸素を取り除く変化を還元と捉えます。反応では熱の出入りも起きます。", "summary": "酸素と結びつく変化を酸化、酸化物から酸素を取り除く変化を還元と捉えます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-ion", "subject": "理科", "sub": "物理・化学", "name": "イオン・酸とアルカリ・電池", "grade": 3, "prerequisites": ["sc-reaction", "sc-electric"], "lesson": "イオンは電子を失ったり受け取ったりして電気を帯びた粒子です。酸とアルカリの中和では水などが生じ、電池は化学エネルギーを電気に変えます。", "summary": "イオンは電子を失ったり受け取ったりして電気を帯びた粒子です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-life", "subject": "理科", "sub": "生物・地学", "name": "生物の観察・分類", "grade": 1, "prerequisites": [], "lesson": "生物を特徴で比べ、共通点と相違点から分類します。顕微鏡は低倍率から観察し、対象を見失わないようにします。", "summary": "生物を特徴で比べ、共通点と相違点から分類します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-plant", "subject": "理科", "sub": "生物・地学", "name": "植物のつくり・光合成", "grade": 1, "prerequisites": ["sc-life"], "lesson": "植物は光合成で二酸化炭素と水から有機物を作り、酸素を出します。呼吸は昼夜とも行い、蒸散は水の移動に関係します。", "summary": "植物は光合成で二酸化炭素と水から有機物を作り、酸素を出します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-cell", "subject": "理科", "sub": "生物・地学", "name": "細胞と体のつくり", "grade": 2, "prerequisites": ["sc-life"], "lesson": "生物の体は細胞からできています。細胞が集まって組織、組織が集まって器官を作ります。植物と動物には共通点と相違点があります。", "summary": "生物の体は細胞からできています。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-human", "subject": "理科", "sub": "生物・地学", "name": "消化・呼吸・循環・神経", "grade": 2, "prerequisites": ["sc-cell"], "lesson": "消化で栄養分を吸収しやすい形にし、血液が運びます。肺で気体交換を行い、神経系が刺激と反応をつなぎます。", "summary": "消化で栄養分を吸収しやすい形にし、血液が運びます。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-genetics", "subject": "理科", "sub": "生物・地学", "name": "生殖・遺伝・進化", "grade": 3, "prerequisites": ["sc-cell"], "lesson": "有性生殖は生殖細胞が合体し、無性生殖は合体を伴いません。遺伝情報は親から子へ伝わり、形質の現れ方を考えます。", "summary": "有性生殖は生殖細胞が合体し、無性生殖は合体を伴いません。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-ecology", "subject": "理科", "sub": "生物・地学", "name": "生態系と環境", "grade": 3, "prerequisites": ["sc-plant", "sc-human"], "lesson": "食物連鎖は生物間の食べる・食べられる関係です。物質は循環し、エネルギーは流れます。分解者は有機物を無機物へ分解します。", "summary": "食物連鎖は生物間の食べる・食べられる関係です。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-earth", "subject": "理科", "sub": "生物・地学", "name": "地震・火山・岩石・地層", "grade": 1, "prerequisites": [], "lesson": "地震のP波はS波より速く到達します。火成岩は冷え方で組織が変わり、地層や化石は過去の環境を知る手掛かりになります。", "summary": "地震のP波はS波より速く到達します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-weather", "subject": "理科", "sub": "生物・地学", "name": "気象・湿度・前線", "grade": 2, "prerequisites": [], "lesson": "気象は気温・湿度・気圧などを観測します。空気が冷えて飽和すると凝結が起こり、前線付近では空気が上昇して雲ができます。", "summary": "気象は気温・湿度・気圧などを観測します。", "icon": "◈", "color": "#85c7b3"}, {"id": "sc-space", "subject": "理科", "sub": "生物・地学", "name": "天体・季節・月と惑星", "grade": 3, "prerequisites": [], "lesson": "地球の自転で日周運動、公転と地軸の傾きで季節変化が起こります。月は太陽光を反射し、位置関係で満ち欠けします。", "summary": "地球の自転で日周運動、公転と地軸の傾きで季節変化が起こります。", "icon": "◈", "color": "#85c7b3"}, {"id": "ja-word", "subject": "国語", "sub": "国語2・文法・古典", "name": "文節・単語・品詞", "grade": 1, "prerequisites": [], "lesson": "文節は文を意味が通じるように短く区切ったまとまり。自立語は単独で文節を作れ、付属語は自立語に付いて働きます。", "summary": "文節は文を意味が通じるように短く区切ったまとまり。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-inflection", "subject": "国語", "sub": "国語2・文法・古典", "name": "用言・活用・助動詞", "grade": 2, "prerequisites": ["ja-word"], "lesson": "動詞・形容詞・形容動詞は用言です。続く語に応じて形が変わることを活用といい、助動詞も活用します。", "summary": "動詞・形容詞・形容動詞は用言です。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-sentence", "subject": "国語", "sub": "国語2・文法・古典", "name": "文の成分・敬語", "grade": 2, "prerequisites": ["ja-word"], "lesson": "主語・述語・修飾語などの関係を捉えます。尊敬語は相手側の動作を高め、謙譲語は自分側の動作を低めて相手を立てます。", "summary": "主語・述語・修飾語などの関係を捉えます。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-classic", "subject": "国語", "sub": "国語2・文法・古典", "name": "古文の言葉・歴史的仮名遣い", "grade": 1, "prerequisites": [], "lesson": "古文は現在と意味が異なる語にも注意します。歴史的仮名遣いは、語中・語尾の「は・ひ・ふ・へ・ほ」などが現代と異なります。", "summary": "古文は現在と意味が異なる語にも注意します。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-kanbun", "subject": "国語", "sub": "国語2・文法・古典", "name": "漢文の訓読・返り点", "grade": 2, "prerequisites": [], "lesson": "漢文は返り点や送り仮名を手がかりに日本語の語順で読みます。レ点はすぐ下の字を先に読み、そのあと上の字に返る印です。", "summary": "漢文は返り点や送り仮名を手がかりに日本語の語順で読みます。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-logic", "subject": "国語", "sub": "国語3・現代文・語句", "name": "説明文・論説文の構造", "grade": 1, "prerequisites": [], "lesson": "主張と根拠、具体例を区別します。接続語は文どうしの関係を示しますが、内容との対応も確かめましょう。", "summary": "主張と根拠、具体例を区別します。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-fiction", "subject": "国語", "sub": "国語3・現代文・語句", "name": "物語・心情と描写", "grade": 1, "prerequisites": [], "lesson": "人物の心情は行動、会話、情景と前後の変化から読み取ります。本文にない事情を勝手に付け足さないことが大切です。", "summary": "人物の心情は行動、会話、情景と前後の変化から読み取ります。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-poetry", "subject": "国語", "sub": "国語3・現代文・語句", "name": "詩・短歌・俳句と表現技法", "grade": 2, "prerequisites": [], "lesson": "短歌は五・七・五・七・七、俳句は五・七・五を基本とします。比喩や反復などの表現が与える印象を考えます。", "summary": "短歌は五・七・五・七・七、俳句は五・七・五を基本とします。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-vocabulary", "subject": "国語", "sub": "国語3・現代文・語句", "name": "漢字・語句・慣用句", "grade": 1, "prerequisites": [], "lesson": "漢字は同音でも意味で使い分けます。慣用句は語全体が作る意味を捉え、文脈に合うか確かめます。", "summary": "漢字は同音でも意味で使い分けます。", "icon": "❧", "color": "#c6a0df"}, {"id": "ja-expression", "subject": "国語", "sub": "国語3・現代文・語句", "name": "要約・意見文・情報の吟味", "grade": 3, "prerequisites": ["ja-logic"], "lesson": "要約では中心となる内容を残します。意見文は主張と根拠を結び、情報は出典や調査方法、事実と意見の区別を確かめます。", "summary": "要約では中心となる内容を残します。", "icon": "❧", "color": "#c6a0df"}, {"id": "so-map", "subject": "社会", "sub": "地理", "name": "地図・緯度経度・時差", "grade": 1, "prerequisites": [], "lesson": "緯度は赤道を0度、経度は本初子午線を0度とします。地球は24時間で360度自転するので、経度15度につき時差1時間が目安です。", "summary": "緯度は赤道を0度、経度は本初子午線を0度とします。", "icon": "◎", "color": "#d8b678"}, {"id": "so-world", "subject": "社会", "sub": "地理", "name": "世界の州・地形・生活", "grade": 1, "prerequisites": ["so-map"], "lesson": "地域の生活は自然環境だけでなく、歴史・文化・産業とも関係します。同じ州の中にも多様な地域があります。", "summary": "地域の生活は自然環境だけでなく、歴史・文化・産業とも関係します。", "icon": "◎", "color": "#d8b678"}, {"id": "so-asia", "subject": "社会", "sub": "地理", "name": "アジアの産業と人口", "grade": 1, "prerequisites": ["so-world"], "lesson": "アジアには多様な気候や文化があります。モンスーンの影響を受ける地域の農業、工業化と都市化などを関連付けます。", "summary": "アジアには多様な気候や文化があります。", "icon": "◎", "color": "#d8b678"}, {"id": "so-europe", "subject": "社会", "sub": "地理", "name": "ヨーロッパ・アフリカ", "grade": 1, "prerequisites": ["so-world"], "lesson": "ヨーロッパでは地域統合、アフリカでは多様な自然と歴史、資源や特定産品に依存する経済などを学びます。", "summary": "ヨーロッパでは地域統合、アフリカでは多様な自然と歴史、資源や特定産品に依存する経済などを学びます。", "icon": "◎", "color": "#d8b678"}, {"id": "so-america", "subject": "社会", "sub": "地理", "name": "南北アメリカ・オセアニア", "grade": 1, "prerequisites": ["so-world"], "lesson": "大規模農業や資源、移民の歴史、森林と開発などを関連付けて学びます。環境と経済の両面を捉えましょう。", "summary": "大規模農業や資源、移民の歴史、森林と開発などを関連付けて学びます。", "icon": "◎", "color": "#d8b678"}, {"id": "so-japan", "subject": "社会", "sub": "地理", "name": "日本の地形・気候・災害", "grade": 2, "prerequisites": ["so-map"], "lesson": "日本は山地が多く、地域や季節で気候が異なります。自然の恵みと災害の双方を、地図や資料から考えます。", "summary": "日本は山地が多く、地域や季節で気候が異なります。", "icon": "◎", "color": "#d8b678"}, {"id": "so-industry", "subject": "社会", "sub": "地理", "name": "日本の人口・産業・交通", "grade": 2, "prerequisites": ["so-japan"], "lesson": "人口分布、産業立地、交通網を関連付けます。割合と人数、総量と一人当たりの値は区別して読みます。", "summary": "人口分布、産業立地、交通網を関連付けます。", "icon": "◎", "color": "#d8b678"}, {"id": "so-region", "subject": "社会", "sub": "地理", "name": "日本の諸地域・地域調査", "grade": 2, "prerequisites": ["so-industry"], "lesson": "地域調査は問いを立て、資料や現地観察で確かめます。地域の特徴は自然と産業、人々の暮らしのつながりから説明します。", "summary": "地域調査は問いを立て、資料や現地観察で確かめます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-ancient", "subject": "社会", "sub": "歴史", "name": "文明の成立・古代国家", "grade": 1, "prerequisites": [], "lesson": "農耕と定住、都市と国家、文字の成立を関連付けます。日本では縄文・弥生・古墳時代の社会の変化を捉えます。", "summary": "農耕と定住、都市と国家、文字の成立を関連付けます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-rules", "subject": "社会", "sub": "歴史", "name": "律令国家・奈良・平安", "grade": 1, "prerequisites": ["hi-ancient"], "lesson": "律令による国家の仕組み、都、仏教、貴族政治と文化を関連付けます。時代に伴う土地制度や政治の変化も重要です。", "summary": "律令による国家の仕組み、都、仏教、貴族政治と文化を関連付けます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-medieval", "subject": "社会", "sub": "歴史", "name": "鎌倉・室町と武士の政治", "grade": 1, "prerequisites": ["hi-rules"], "lesson": "鎌倉幕府では御恩と奉公が将軍と御家人を結びました。室町時代には守護大名の成長や商業・自治の発達が見られます。", "summary": "鎌倉幕府では御恩と奉公が将軍と御家人を結びました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-edo", "subject": "社会", "sub": "歴史", "name": "天下統一・江戸幕府と社会", "grade": 2, "prerequisites": ["hi-medieval"], "lesson": "天下統一を経て江戸幕府が成立しました。幕府と藩の支配、身分、対外関係、都市と文化の発達を学びます。", "summary": "天下統一を経て江戸幕府が成立しました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-modern", "subject": "社会", "sub": "歴史", "name": "近代革命・産業革命", "grade": 2, "prerequisites": [], "lesson": "欧米の市民革命は政治の権利や制度を変え、産業革命は生産や社会を変えました。発展とともに労働問題なども生まれました。", "summary": "欧米の市民革命は政治の権利や制度を変え、産業革命は生産や社会を変えました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-meiji", "subject": "社会", "sub": "歴史", "name": "開国・明治維新・近代国家", "grade": 2, "prerequisites": ["hi-edo", "hi-modern"], "lesson": "開国と幕府の崩壊を経て、明治政府は中央集権化と近代化を進めました。自由民権運動や憲法制定も関連付けます。", "summary": "開国と幕府の崩壊を経て、明治政府は中央集権化と近代化を進めました。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-war", "subject": "社会", "sub": "歴史", "name": "世界大戦・恐慌と日本", "grade": 3, "prerequisites": ["hi-meiji"], "lesson": "二つの世界大戦の背景、世界恐慌、政治と社会の変化を因果関係で捉えます。出来事の順序と同時代の世界にも注目します。", "summary": "二つの世界大戦の背景、世界恐慌、政治と社会の変化を因果関係で捉えます。", "icon": "◎", "color": "#d8b678"}, {"id": "hi-postwar", "subject": "社会", "sub": "歴史", "name": "戦後改革・冷戦・現代への歩み", "grade": 3, "prerequisites": ["hi-war"], "lesson": "戦後日本の民主化と経済成長、冷戦、国際社会の変化を捉えます。経済成長による生活の変化と課題も学びます。", "summary": "戦後日本の民主化と経済成長、冷戦、国際社会の変化を捉えます。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-rights", "subject": "社会", "sub": "公民", "name": "日本国憲法・人権", "grade": 3, "prerequisites": [], "lesson": "日本国憲法の基本原理は国民主権・基本的人権の尊重・平和主義です。権利は互いに関わり、他者の権利への配慮も必要です。", "summary": "日本国憲法の基本原理は国民主権・基本的人権の尊重・平和主義です。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-politics", "subject": "社会", "sub": "公民", "name": "国会・内閣・裁判所", "grade": 3, "prerequisites": ["ci-rights"], "lesson": "国会は立法、内閣は行政、裁判所は司法を担います。権力を分け、互いに抑制することで集中を防ぎます。", "summary": "国会は立法、内閣は行政、裁判所は司法を担います。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-local", "subject": "社会", "sub": "公民", "name": "選挙・地方自治・合意形成", "grade": 3, "prerequisites": ["ci-politics"], "lesson": "地方自治は身近な地域の課題を住民が考える仕組みです。意思決定では効率と公正、少数意見への配慮を考えます。", "summary": "地方自治は身近な地域の課題を住民が考える仕組みです。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-market", "subject": "社会", "sub": "公民", "name": "市場・企業・消費者", "grade": 3, "prerequisites": [], "lesson": "市場では需要と供給が価格に関係します。企業・家計・政府の関わりを捉え、契約や情報の扱いも学びます。", "summary": "市場では需要と供給が価格に関係します。", "icon": "◎", "color": "#d8b678"}, {"id": "ci-public", "subject": "社会", "sub": "公民", "name": "財政・社会保障・国際社会", "grade": 3, "prerequisites": ["ci-market", "ci-rights"], "lesson": "政府は税などを財源に公共サービスや社会保障を担います。国際社会の課題は国境を越えた協力や持続可能性の観点から考えます。", "summary": "政府は税などを財源に公共サービスや社会保障を担います。", "icon": "◎", "color": "#d8b678"}]);

function filterOptions(values,selected,all){return `<option value="">${all}</option>`+values.map(v=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('');}
function explore(){const subs=[...new Set(C.units.filter(u=>!filters.subject||u.subject===filters.subject).map(u=>u.sub))];return `<div class="intro"><div><div class="eyebrow">THE ARCHIVE</div><h1>どこからでも、進める。</h1><p class="muted">五教科 ${C.units.length}単元。学年は目安。未習の内容にも進めます。</p></div></div><div class="card"><h3>今日は、どんな考え方をしよう？</h3><div class="modegrid">${Object.entries(C.modes).map(([k,v])=>`<button data-mode="${k}">${v} →</button>`).join('')}</div><p class="subtle">おまかせ修練はテスト範囲・復習の時期・基礎とのつながりから選びます。</p></div><div class="card filters"><label>教科<select id="filter-subject">${filterOptions(['数学','英語','国語','理科','社会'],filters.subject,'すべての教科')}</select></label><label>サブ科目<select id="filter-sub">${filterOptions(subs,filters.sub,'すべてのサブ科目')}</select></label><label>学年の目安<select id="filter-grade">${filterOptions([1,2,3],filters.grade,'すべての学年')}</select></label><label class="search-label">単元・キーワード<input id="filter-query" type="search" value="${esc(filters.query)}" placeholder="例：方程式、植物、古文"></label><label class="checkline"><input type="checkbox" id="filter-due" ${filters.due?'checked':''}>復習の候補</label><label class="checkline"><input type="checkbox" id="filter-scope" ${filters.scope?'checked':''}>テスト範囲のみ</label></div><p id="filter-count" class="subtle">${matchingUnits().length}単元を表示 · テスト範囲は単元の入口で指定できます。</p><div class="grid" id="unit-results">${matchingUnits().map(unitCard).join('')||'<p class="muted">該当する単元がありません。絞り込みを変えてみてください。</p>'}</div><p class="subtle">主要単元の入口を収録しています。学校ごとの全範囲や発展問題、記述・図形作図・リスニングは拡充が必要です。</p>`;}
function unitPage(id){const u=unit(id);if(!u)return explore();let p=E.progress(state,id),d=E.unitStatus(state,id);return `<a class="previous" href="#explore">← 探索へ戻る</a><div class="intro"><div><div class="eyebrow">${u.subject} / ${u.sub}</div><h1>${u.name}</h1><p class="muted">${u.summary}</p><span class="pill">中${u.grade}目安</span></div></div><div class="card"><div class="row spread"><span class="pill">${p.label}</span><span class="muted">${p.count}回の挑戦</span></div><div class="evidence-grid">${Object.entries(C.modes).map(([k,v])=>`<span class="pill">${d.modes.includes(k)?'✓ ':'○ '}${v}</span>`).join('')}</div><p class="subtle">✓ はヒントなしの正解記録。理解の完成を示すものではありません。${d.isDue?'日を置いた復習の候補です。':''}</p>${u.prerequisites?.length?`<p class="subtle">つながる基礎：${u.prerequisites.map(id=>`<a href="#unit/${id}">${unit(id).name}</a>`).join(' ／ ')}<br>基礎が未学習でも、この単元へ進めます。</p>`:''}<label class="checkline"><input type="checkbox" data-exam-unit="${id}" ${(state.examScope||[]).includes(id)?'checked':''}>次のテスト範囲に入れる</label><p class="subtle">学校での学習状況は任意です。未習でも進めます。</p><div class="row"><button class="secondary" data-school="${id}:unlearned">${state.school[id]?.status==='unlearned'?'✓ ':''}まだ学校で習っていない</button><button class="secondary" data-school="${id}:learned">${state.school[id]?.status==='learned'?'✓ ':''}学校で習った</button></div><details><summary>考え方を読んでみる</summary><p class="lesson">${u.lesson}</p></details></div>${C.pilots[id]?`<div class="card"><h2>${u.name}の学習記録</h2><p class="subtle">${C.pilots[id].description}</p>${C.pilots[id].skills.map(k=>{const p=E.skillProgress(state,k.id);return `<div class="record row spread"><b>${k.name}</b><span>${p.label}${p.recheck?' · 再確認の候補':''}</span></div>`;}).join('')}<p class="subtle">以前の解答を新しい項目へ自動換算しません。${C.pilots[id].limitation}</p></div>`:''}<div class="card"><h2>この場所で挑戦する</h2><p class="subtle">異なる考え方を組み合わせたセット。完了した課題の数に応じてポイントが貯まります。</p><button data-start="${id}">いろいろな角度から →</button><div class="modegrid">${Object.entries(C.modes).map(([k,v])=>`<button data-start="${id}" data-start-mode="${k}">${v}</button>`).join('')}</div></div>`;}

function questionMedia(q){let out=q.diagram?TrailGeometry.render(q.diagram):'';if(q.table){const t=q.table;out+=`<div class="data-table"><table><caption>${esc(t.caption)}</caption><thead><tr>${t.columns.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map((c,i)=>i===0?`<th scope="row">${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
if(q.graph){const g=q.graph;out+=`<figure class="wave-figure"><figcaption>波形A・B（横軸・縦軸の尺度は共通）</figcaption><svg viewBox="0 0 600 ${g.traces.length*150}" role="img" aria-label="同じ時間幅${g.durationMs}ミリ秒で記録した波形">${g.traces.map((t,i)=>{const y=i*150+65;let pts=[];for(let j=0;j<=500;j++)pts.push((65+j)+','+(y-20*t.amplitude*Math.sin(2*Math.PI*t.cycles*j/500)).toFixed(2));return `<text x="12" y="${y}" fill="currentColor">${esc(t.name)}</text><path d="M65 ${y-45} V${y+45} M65 ${y} H565" stroke="#8b829c" fill="none"/><polyline points="${pts.join(' ')}" fill="none" stroke="#e3c585" stroke-width="2.5"/><text x="62" y="${y+64}" fill="currentColor">0</text><text x="475" y="${y+64}" fill="currentColor">${g.durationMs} ms</text>`;}).join('')}</svg><details><summary>図の数値を文字で読む</summary><p>${g.traces.map(t=>`${esc(t.name)}：${g.durationMs}msに${t.cycles}周期、振幅の相対値${t.amplitude}`).join(' ／ ')}</p></details></figure>`;}
return out;}

function learn(){const a=state.active;if(!a)return home();const q=a.queue[a.index],u=unit(a.unit);return `<div class="row spread"><button class="quiet" data-pause>← 保存して中断</button><small>${a.index+1} / ${a.queue.length} 課題</small></div><div class="progress"><span style="width:${(a.index+(a.feedback?1:0))/a.queue.length*100}%"></span></div><section class="card"><div class="row spread"><span class="pill">${u.subject} · ${u.name}</span><small>${C.modes[q.mode]}</small></div>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}${questionMedia(q)}<h2 class="prompt">${esc(q.prompt)}</h2>${a.feedback?'':q.options?`<div class="options">${q.options.map((o,i)=>`<button class="option" data-answer-index="${i}"><span>${i+1}</span>${esc(o)}</button>`).join('')}</div>`:`<form id="answer-form" class="input-row"><input id="answer-input" aria-label="${esc(q.inputLabel||'解答')}" inputmode="${q.grading==='number'||q.grading==='short_text'?'text':'decimal'}" autocomplete="off" value="${esc(a.draft)}" placeholder="${esc(q.inputPlaceholder||(q.grading==='number'?'整数・小数・分数':'数を入力'))}"><button type="submit">確かめる →</button></form>`}${a.inputError?`<p role="alert" class="notice">${esc(a.inputError)}</p>`:''}${!a.feedback?`<div class="row" style="margin-top:20px"><button class="quiet" data-hint>${a.hint&&q.hints?(a.hintStep>=q.hints.length?'ヒントを表示中':'次のヒントを見る'):'考え方をヒントにする'}</button><button class="quiet" data-unlearned>まだ習っていない</button></div>${a.hint?`<div class="notice">${q.hints?q.hints.slice(0,a.hintStep||1).map((h,i)=>`<p>ヒント${i+1}：${esc(h)}</p>`).join(''):u.lesson}</div>`:''}${a.taught?`<div class="notice"><strong>考え方の入口</strong><p>${u.lesson}</p>${a.unit==='math-equation'?'<p>例：2x＋3＝11なら、両辺から3を引いて2x＝8、両辺を2で割ってx＝4。元の式に4を入れて、左右が11になるか確かめます。</p>':''}</div><p class="subtle">説明を使って学習中。ポイントは変わりません。</p>`:''}`:`<div class="feedback ${a.feedback.ok?'':'review'}" role="status"><h3>${a.feedback.ok?'✓ 確かめられた！':'ここから、考え直そう。'}</h3><p><strong>${esc(a.feedback.answer)}</strong></p><p>${esc(a.feedback.explanation)}</p>${!a.feedback.ok?`<label class="checkline"><input type="checkbox" id="review-check" ${a.review?'checked':''}>考え方を確かめた</label>`:''}<button data-next ${!a.feedback.ok&&!a.review?'disabled':''}>${a.index+1===a.queue.length?'今回の発見を見る':'次の挑戦へ'} →</button></div>`}</section><p class="subtle">今回のセット完了で ${a.queue.length} pt。正解数・ヒント利用による減点はありません。</p>`;}
function spellCard(a){const date=state.awards.find(x=>x.id===a.id)?.at;return `<article class="award spell-card tone-${a.element}"><div class="spell-meta"><span>術式 ${String(E.awards.indexOf(a)+1).padStart(3,'0')}</span></div><div class="sigil"><span>${a.mark}</span></div><h3>${a.name}</h3><p>${a.incantation}</p><small>${date?fmt(date)+' 習得':''}</small></article>`;}

function abilities(){const subjects=['数学','英語','国語','理科','社会'],labels=['構築の知識','詠唱の知識','解読の知識','現象の知識','世界の知識'];return `<div class="abilities">${subjects.map((subject,i)=>{let us=C.units.filter(u=>u.subject===subject),ids=new Set(us.map(u=>u.id)),n=state.sessions.filter(x=>ids.has(x.unit)).length;return `<button data-subject="${subject}" class="ability"><span>${us[0].icon}</span><b>${labels[i]}</b><small>${subject} · 修練 ${n}回</small></button>`;}).join('')}</div>`;}
function collection(){const visible=state.awards.slice().reverse().map(x=>award(x.id)).filter(Boolean);let hints=E.awards.filter(a=>!state.awards.some(x=>x.id===a.id)).filter((a,i)=>i%5===0).slice(0,3);return `<div class="intro"><div><div class="eyebrow">YOUR PERSONAL GRIMOIRE</div><h1>自分だけの、魔導書。</h1><p class="muted">${visible.length}種の呪文を習得。</p></div></div><div class="card"><h3>魔法を支える知識</h3><p class="subtle">修練の記録が、知識として積み上がる。呪文の習得条件は、まだ秘密。</p>${abilities()}</div><div class="awardgrid">${visible.slice(0,collectionLimit).map(spellCard).join('')}${hints.map(a=>`<article class="award locked"><div class="sigil"><span>?</span></div><h3>封じられた術式</h3><p>${a.hint}</p><small>習得条件は未解明</small></article>`).join('')}</div>${visible.length>collectionLimit?'<button id="more-spells" class="secondary">さらに開く</button>':''}<p class="subtle">すべての術式が見えているわけではありません。新しい知識が、次の発見につながります。</p>`;}

function records(){return `<div class="intro"><div><div class="eyebrow">RECORD OF PRACTICE</div><h1>積み重ねは、残っている。</h1></div></div>${levelCard()}${numbers()}<div class="card"><h2>取り組んだ単元</h2><p class="subtle">${new Set(state.attempts.map(a=>a.unit)).size} / ${C.units.length} 単元に挑戦</p>${C.units.filter(u=>state.attempts.some(a=>a.unit===u.id)).map(u=>{let h=state.attempts.filter(a=>a.unit===u.id),p=E.progress(state,u.id);return `<div class="record row spread"><div><b>${u.name}</b><small>${p.label} · ${h.length}回の挑戦</small></div><a href="#unit/${u.id}">もう一度 ↗</a></div>`}).join('')}<p class="subtle">「複数の角度で確認」は、日を置いた自力の正解を含む状態です。単元全体の習得完了を意味しません。</p></div><div class="card"><h2>最近の修練</h2>${state.sessions.slice(-15).reverse().map(s=>`<div class="record"><b>${unit(s.unit).name}</b><small>${fmt(s.at)} · ${s.count}課題 · ${s.modes.map(m=>C.modes[m]).join(' / ')}</small></div>`).join('')||'<p class="muted">最初の一歩が、ここに記録されます。</p>'}</div>${state.legacy.length?`<div class="notice">旧版の解答履歴を ${state.legacy.length} 件保管しています。新しい習得判定とポイントには換算していません。</div>`:''}`;}
function family(){const p=E.totals(state),recent=state.awards.slice(-3).reverse().map(x=>award(x.id)).filter(Boolean);return `<section class="card family mage-profile"><div class="eyebrow">MAGE PORTRAIT</div><div class="mage-avatar" aria-hidden="true">✧</div><h1>${esc(state.name)}</h1><p class="muted">${state.awards.length}種の呪文を記した魔法使い</p>${levelCard()}<div class="eyebrow" style="margin-top:25px">今週の取り組み</div><div class="bigscore">${p.week}<small>pt</small></div><p class="muted">修練を終えた分だけ、積み上がる。</p><div class="sectionhead"><h2>最近習得した呪文</h2><a href="#collection">魔導書を見る ↗</a></div>${recent.length?`<div class="awardgrid">${recent.map(spellCard).join('')}</div>`:'<p class="subtle">修練で習得した呪文が、ここに記録されます。</p>'}${numbers()}<p class="subtle">レベル、習得した呪文、今週の取り組みを家族で見せ合おう。<br>週間集計は日本時間・月曜始まり。端末間の自動共有はありません。</p></section>`;}

function settings(){return `<div class="intro"><div><div class="eyebrow">MAGE SETTINGS</div><h1>記録・設定</h1></div></div><div class="card"><h2>プロフィール</h2><label for="name">表示名</label><div class="input-row"><input id="name" maxlength="24" value="${esc(state.name)}"><button id="save-name">保存</button></div></div><div class="card"><h2>記録を守る</h2><p class="subtle">機種変更やブラウザのデータ削除に備えて、ファイルで保存できます。復元前の記録を一つ退避してから置き換えます。間違えた場合は下の退避記録から戻せます。</p><div class="row"><button id="export">バックアップを書き出す</button><button class="secondary" id="restore">バックアップを復元</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>${storageBlocked?'<button class="secondary" id="rescue">読み込めなかった保存データを救出</button>':''}</div>${recoveryPanel()}<div class="card"><h2>旧版の履歴を保管</h2><p class="subtle">旧アプリで書き出したJSONを取り込めます。原記録を保管し、新しいポイントや習得度には自動換算しません。</p><button class="secondary" id="legacy">旧版の記録を読み込む</button><input type="file" id="legacy-file" accept=".json,application/json" hidden></div><div class="card"><h2>お小遣いとの交換記録</h2><p class="subtle">換算レートは未設定です。家族で決めた後、実際に受け取った交換だけを記録してください。</p><p>交換可能：<b>${E.totals(state).balance} pt</b></p><label for="redeem-amount">交換に使ったポイント</label><input id="redeem-amount" type="number" min="1" step="1" placeholder="ポイント"><label for="redeem-note">メモ（任意）</label><input id="redeem-note" maxlength="100" placeholder="例：お小遣いを受け取った"><div><button class="secondary" id="redeem" style="margin-top:16px">交換を記録する</button></div>${state.ledger.filter(x=>x.kind==='redeem').slice(-8).reverse().map(x=>`<div class="record">${-x.amount} pt 交換<small>${fmt(x.at)} ${esc(x.note)}</small></div>`).join('')}</div>`;}
function done(){if(!lastResult)return home();const r=lastResult;return `<div class="card done"><div class="seal">✳</div><div class="eyebrow">PRACTICE COMPLETE</div><h1>知識が、魔法に変わる。</h1><p class="muted">${unit(r.unit).name}の挑戦を完了しました。</p><div class="score">+ ${r.amount} <small>pt</small></div><div class="subtle">+ ${r.xp} XP</div>${r.afterLevel>r.beforeLevel?`<div class="level-up">LEVEL UP · Lv. ${r.beforeLevel} → Lv. ${r.afterLevel}<br>${E.mageLevel(state).rank}</div>`:''}${levelCard()}${r.unlocked.length?`<div class="notice"><b>新しい呪文を習得しました！</b><p>${r.unlocked.map(id=>`${award(id).mark} ${award(id).name}`).join(' ／ ')}</p></div>`:''}<div class="row"><button data-go="collection" class="secondary">魔導書を開く</button><button data-start="">修練を続ける →</button><button class="secondary" data-go="explore">別の場所を探索</button><button class="quiet" data-go="home">今日はここまで</button></div><p class="subtle">続けた分だけ積み上がります。一日のポイント上限はありません。</p></div>`;}
function start(id,mode){if(storageBlocked){toast('記録・設定から保存データを復元してください。');return;}if(state.active){go('learn');toast('途中の学習を再開します。別の挑戦は中断画面から選べます。');return;}
let a=E.makeSession(state,id||null,mode||null);if(!a){modal('別の景色へ進もう','<p>この選び方では、今日の新しい課題を一巡しました。別の学び方や単元を選べます。日を置くと復習として戻れます。</p>');return;}state.active=a;save();go('learn');}
function download(obj,name){let url=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function render(){let route=location.hash.slice(1)||'home',page=route.split('/')[0];$('breadcrumb').textContent=({home:'今日の修練',explore:'知識の書庫',unit:'単元の入口',learn:'挑戦の途中',collection:'自分だけの魔導書',records:'学びの足跡',settings:'魔法使いの支度',family:'家族に見せる',done:'今回の成果'})[page]||'今日の修練';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(page==='unit'?'explore':page)));$('app').innerHTML=({home,explore,collection,records,settings,family,learn,done}[page]||(()=>unitPage(route.split('/')[1])))();bind();}
function bind(){
document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{filters={subject:b.dataset.subject,sub:'',grade:'',query:'',due:false,scope:false};go('explore');});
for(const k of ['subject','sub','grade','due','scope'])if($('filter-'+k))$('filter-'+k).onchange=e=>{filters[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='subject')filters.sub='';render();};
if($('filter-query'))$('filter-query').oninput=e=>{filters.query=e.target.value.trim();const us=matchingUnits();$('unit-results').innerHTML=us.map(unitCard).join('')||'<p class="muted">該当する単元がありません。</p>';$('filter-count').textContent=us.length+'単元を表示 · テスト範囲は単元の入口で指定できます。';};
document.querySelectorAll('[data-exam-unit]').forEach(b=>b.onchange=()=>{const ids=new Set(state.examScope||[]);b.checked?ids.add(b.dataset.examUnit):ids.delete(b.dataset.examUnit);state.examScope=[...ids];save();});
if($('more-spells'))$('more-spells').onclick=()=>{collectionLimit+=24;render();};
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.startMode));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(null,b.dataset.mode));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>go('learn'));document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>{let [id,status]=b.dataset.school.split(':');state.school[id]={status,at:Date.now()};save();render();});
const pause=document.querySelector('[data-pause]');if(pause)pause.onclick=()=>{save();modal('途中の学習は保存しました','<p>後で同じところから再開できます。別の挑戦に切り替える場合は、このセットの未完了分を終了します。回答済みの履歴は残り、完了ポイントは付きません。</p><div class="row"><button id="pause-home">ホームへ</button><button class="secondary" id="switch-unit">このセットを終了して探索へ</button></div>');$('pause-home').onclick=()=>{$('dialog').close();go('home');};$('switch-unit').onclick=()=>{state.active=null;save();$('dialog').close();go('explore');};};
document.querySelectorAll('[data-answer-index]').forEach(b=>b.onclick=()=>{const a=state.active;E.answer(state,a.queue[a.index].options[+b.dataset.answerIndex]);save();render();});
if($('answer-input'))$('answer-input').oninput=e=>{state.active.draft=e.target.value;save();};if($('answer-form'))$('answer-form').onsubmit=e=>{e.preventDefault();E.answer(state,$('answer-input').value);save();render();};
const hint=document.querySelector('[data-hint]');if(hint)hint.onclick=()=>{state.active.hint=true;state.active.hintStep=Math.min((state.active.hintStep||0)+1,state.active.queue[state.active.index].hints?.length||1);save();render();};const untaught=document.querySelector('[data-unlearned]');if(untaught)untaught.onclick=()=>{state.active.taught=true;state.active.hint=true;state.active.hintStep=1;state.school[state.active.unit]={status:'unlearned',at:Date.now()};save();render();};
if($('review-check'))$('review-check').onchange=e=>{state.active.review=e.target.checked;save();document.querySelector('[data-next]').disabled=!e.target.checked;};const next=document.querySelector('[data-next]');if(next)next.onclick=()=>{let r=E.advance(state);save();if(r?.done){lastResult=r;go('done');}else render();};
if($('save-name'))$('save-name').onclick=()=>{state.name=$('name').value.trim()||'見習い魔法使い';save();toast('表示名を保存しました。');};if($('export'))$('export').onclick=()=>download(state,'study-trail-backup-'+E.day(Date.now())+'.json');if($('rescue'))$('rescue').onclick=()=>download(localStorage.getItem(KEY)||'','study-trail-rescue.json');
if($('restore'))$('restore').onclick=()=>$('import-file').click();if($('import-file'))$('import-file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('20MB以下のファイルを指定してください。');pendingImport=E.validate(JSON.parse(await f.text()));modal('バックアップを復元しますか？',`<p>${esc(pendingImport.name)}の ${pendingImport.sessions.length} セットの記録です。現在の記録を退避してから置き換えます。ファイルでも残しておくと安心です。</p><button id="confirm-import">この内容に置き換える</button>`);$('confirm-import').onclick=()=>{try{state=recovery.replace(pendingImport);}catch(e){toast('現在の記録の退避または保存ができないため、復元を中止しました。');return;}storageBlocked=false;pendingImport=null;$('storage-warning').textContent='';$('dialog').close();render();toast('復元しました。');};}catch(err){modal('読み込めません',`<p>${esc(err.message)}</p>`);}};
if($('export-recovery'))$('export-recovery').onclick=()=>{try{const item=recovery.inspect();if(item)download(item.raw,'study-trail-before-restore.json');}catch(e){toast('退避記録を読み込めません。');}};
if($('undo-restore'))$('undo-restore').onclick=()=>{try{const item=recovery.inspect();if(!item?.state)throw Error('退避記録を復元できません。');modal('置き換える前に戻しますか？',`<p>${esc(item.state.name)}の ${item.state.sessions.length} セットの記録に戻します。現在の記録を新しい退避として残します。</p><button id="confirm-undo">この記録に戻す</button>`);$('confirm-undo').onclick=()=>{try{state=recovery.undo();storageBlocked=false;$('storage-warning').textContent='';$('dialog').close();render();toast('置き換える前の記録に戻しました。');}catch(e){toast('退避または保存ができないため中止しました。');}};}catch(e){toast(e.message);}};
if($('legacy'))$('legacy').onclick=()=>$('legacy-file').click();if($('legacy-file'))$('legacy-file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('20MB以下を指定してください。');let v=JSON.parse(await f.text());if(v.kind!=='midterm-backup'||![1,2].includes(v.schemaVersion)||!Array.isArray(v.history)||v.history.length>100000||v.history.some(x=>!x||typeof x.skill!=='string'||typeof x.ok!=='boolean'||!Number.isFinite(x.at)))throw Error('旧版の全記録バックアップを指定してください。');let seen=new Set(state.legacy.map(x=>JSON.stringify(x)));for(const x of v.history){let k=JSON.stringify(x);if(!seen.has(k)){state.legacy.push(x);seen.add(k);}}save();render();toast('旧版の履歴を保管しました。');}catch(err){modal('読み込めません',`<p>${esc(err.message)}</p>`);}};
if($('redeem'))$('redeem').onclick=()=>{let amount=Number($('redeem-amount').value),note=$('redeem-note').value;if(!Number.isSafeInteger(amount)||amount<=0||amount>E.totals(state).balance){toast('残高以内の正の整数を入力してください。');return;}modal('受け取りを確認',`<p>${amount} pt を交換済みとして記録します。実際のお小遣いは受け取りましたか？</p><button id="confirm-redeem">受け取ったので記録する</button>`);$('confirm-redeem').onclick=()=>{try{E.redeem(state,amount,note);save();$('dialog').close();render();}catch(e){toast(e.message);}};};}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{state=E.validate(JSON.parse(e.newValue));render();toast('別のタブで保存された最新の記録に更新しました。');}catch(err){storageBlocked=true;$('storage-warning').textContent='別のタブの記録を読み込めません。バックアップ後に再読み込みしてください。';}});
window.addEventListener('hashchange',render);render();
})();
</script></body></html>
